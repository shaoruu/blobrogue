# nginx WebSocket reverse-proxy example for the blobrogue game server. Add this location (or a
# subdomain server block) to the existing nginx that already fronts town, reusing its Let's
# Encrypt cert. The Node server binds 127.0.0.1:8090 and speaks plain ws; nginx does TLS on 443
# so wss:// is the only thing on the wire. No new firewall port is needed (only 443/80/SSH stay
# open — mind Hetzner's separate Cloud firewall).
#
# Client points VITE_GS_URL=wss://blobrogue-gs.<domain>/ws

location /ws {
    proxy_pass http://127.0.0.1:8090/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;   # REQUIRED for the WS handshake
    proxy_set_header Connection "upgrade";     # REQUIRED for the WS handshake
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;                  # long-lived game sockets: don't cull them
    proxy_send_timeout 3600s;
}

# /healthz and /metrics bind 127.0.0.1 and must NOT be proxied to the internet. If you want
# external uptime checks, IP-allowlist them — never expose /metrics publicly.
#
# location /healthz {
#     allow 127.0.0.1;        # + your monitoring IPs
#     deny all;
