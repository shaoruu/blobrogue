# nginx example for the admin control-plane proxy. Add to the nginx that already fronts town,
# reusing its Let's Encrypt cert. The control service binds 127.0.0.1:8091 and is NEVER exposed
# directly — the ONLY public surface is 443. The admin.create.town panel server is the trusted
# proxy: it authenticates the human operator and attaches the short-lived signed ops token
# (Authorization: Bearer <adminToken>) before forwarding here.
#
# There are TWO distinct proxies below and they must not be confused:
#   /ws            -> game server (8090)   — player WebSocket traffic
#   admin control  -> control plane (8091) — ops API, panel-authenticated only

# --- game WebSocket (players) ---
location /ws {
    proxy_pass http://127.0.0.1:8090/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;   # REQUIRED for the WS handshake
    proxy_set_header Connection "upgrade";     # REQUIRED for the WS handshake
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;                  # long-lived game sockets
    proxy_send_timeout 3600s;
}

# --- admin control plane (operators, via the admin.create.town panel proxy) ---
# Prefer terminating this on a SEPARATE admin subdomain/server block with its own access control
# (the panel session + the ops token). Do NOT expose /v1/* on the public game host.
location /control/ {
    # Defense in depth: only the panel origin is expected here; the ops token is the real gate.
    proxy_pass http://127.0.0.1:8091/;   # trailing slash: strips the /control prefix
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;             # a deploy op may take a while to verify
    client_max_body_size 32k;            # control bodies are tiny; cap them
}

# gs /healthz and /metrics bind 127.0.0.1 and must NOT be proxied to the internet. The control
# plane reads them over loopback and re-exposes bounded, redacted views via /control/v1/status,
# /control/v1/metrics, /control/v1/logs (all behind the ops token). Never proxy them directly.
#
# location = /healthz { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:8090/healthz; }
