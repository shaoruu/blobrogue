<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
    <title>blobrogue — a cowboy-blob roguelike</title>
    <style>
      /* CANONICAL :root tokens (ui designer, docs/ui/root_tokens.css) — all HUD CSS resolves against these. */
      :root{
        --dun-0:#05030b; --dun-1:#0e0b1a; --dun-2:#171227; --dun-3:#2a2140; --dun-4:#46356b;
        --amber:#ffb43b; --amber-hi:#ffd166; --amber-lo:#b06e12; --cream:#ffe9b0;
        --lea-0:#301c0e; --lea-1:#6b401e; --lea-2:#9c6633;
        --grn:#7fdd5a; --red:#ff5a5a; --bone:#e8e0c8; --blu:#5ab6ff; --pur:#b06bff;
        /* Two decoupled affirmative greens, kept distinct from --grn (the dash/kit accent)
           AND from each other, so menu chrome and live-HUD readability can diverge later
           without one silently shifting the other. --ok is menu/lobby status (connected /
           ready / good-to-go); --at-exit is the in-run HUD "teammate is AT THE EXIT" cue. */
        --ok:#7cfc98; --at-exit:#8affc0;
        --ink:#120a24;
        /* Secondary text greys — ONE family (was six near-identical hexes used at random):
           --ink-mute is the primary secondary text, --ink-faint the dimmest label ink. */
        --ink-mute:#9a8fb5; --ink-faint:#6f6689;
        /* Rarity + danger accents, tokenized so every surface that signals legendary loot
           or boss/health danger reads from ONE ramp. */
        --gold:#b8860b; --gold-hi:#d4a017; --gold-bright:#ffd700;
        --danger:#ff5a5f; --danger-deep:#c81e2e;
        --f-logo:'Press Start 2P',monospace;
        --f-ui:'Silkscreen','Press Start 2P',monospace;
        --f-num:'VT323',monospace;
        /* Type ramp — every UI size snaps to one of these steps (no more ~17 one-offs). */
        --fs-2xs:8px; --fs-xs:9px; --fs-sm:11px; --fs-md:14px; --fs-lg:18px; --fs-num:19px; --fs-title:34px;
        --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
        /* Panel frames — the two canonical pixel shells (modal/menu vs in-world/tooltip). */
        --frame-strong:0 0 0 3px var(--dun-0),0 0 0 6px var(--dun-4),0 0 0 9px var(--dun-0);
        --frame-soft:0 0 0 2px var(--ink),inset 0 0 0 2px var(--dun-3);
        /* ONE focus ring for every interactive element (grayscale-distinct, high-contrast). */
        --focus-ring:3px solid var(--cream);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* The HTML `hidden` attribute must ALWAYS win: any element with an authored `display:`
         silently defeats the UA-level [hidden] rule, so a toggle that (correctly) flips the
         attribute would still paint. This one global reset kills that whole class of bug — every
         genuinely-hidden element disappears — so no per-element patch is ever needed. `!important`
         is correct here: nothing legitimately wants a hidden element to render (a real show/hide
         flips the attribute, never leans on display). */
      [hidden] { display: none !important; }
      html, body { height: 100%; background: #0e0b1a; overflow: hidden; font-family: 'Silkscreen', 'Press Start 2P', monospace; }
      #app { display: flex; align-items: center; justify-content: center; height: 100%; }
      canvas { image-rendering: pixelated; background: #14101f; touch-action: none; }
      /* The game canvas owns this exact viewport box from the FIRST paint (same formula the
         resize handler uses for the backing store), so the boot-time attribute resize can
         never shift the layout under the title menu. */
      #game { width: min(100vw, 2560px); height: min(100vh, 1440px); }

      /* === GLOBAL PIXEL SCROLLBAR ===
         ONE scrollbar for every scrollable surface (menu shell, closet grid, run-build
         strip, drawers, leaderboard — anything that overflows): thin, squared, token-
         colored, so the native OS chrome never breaks the dungeon look. Firefox via
         scrollbar-width/scrollbar-color; WebKit via the pseudo-element parts. No radius,
         no gradients — a flat dun thumb that warms to amber-lo under the pointer. */
      *{ scrollbar-width:thin; scrollbar-color:var(--dun-4) var(--dun-0); }
      ::-webkit-scrollbar{ width:10px; height:10px; }
      ::-webkit-scrollbar-track{ background:var(--dun-0); box-shadow:inset 0 0 0 1px var(--dun-1); }
      ::-webkit-scrollbar-thumb{ background:var(--dun-4); border:2px solid var(--dun-0); border-radius:0; }
      ::-webkit-scrollbar-thumb:hover{ background:var(--amber-lo); }
      ::-webkit-scrollbar-thumb:active{ background:var(--amber-lo); }
      ::-webkit-scrollbar-corner{ background:var(--dun-0); }
      /* Fixed panels reserve their scrollbar gutter up front, so content never shifts
         when an overflow appears mid-hydration (zero-CLS). */
      .menu, .closet-grid, .pc-build, .hb-drawer{ scrollbar-gutter:stable; }

      /* --- HUD 4-corner layout (ui designer, docs/ui/hud_section_B_hud.css) --- */
      /* --ui-scale is set from the persisted UI-scale setting (src/ui/settings.ts). */
      #hud{ position:fixed; inset:0; z-index:5; pointer-events:none; font-family:var(--f-num); zoom:var(--ui-scale,1); }
      .hud-corner{ position:absolute; display:flex; flex-direction:column; gap:8px; }
      .hud-corner.tl{ top:16px; left:16px; }
      .hud-corner.tr{ top:16px; right:16px; align-items:flex-end; }
      .hud-corner.br{ bottom:16px; right:16px; align-items:flex-end; }
      .hud-corner.bl{ bottom:16px; left:16px; }
      .statpanel{ background:rgba(5,3,11,.62); box-shadow:inset 0 0 0 2px var(--dun-3),0 3px 0 rgba(0,0,0,.4); padding:9px 11px; display:flex; flex-direction:column; gap:7px; }
      .hearts{ display:flex; gap:3px; } .hearts canvas{ image-rendering:pixelated; }
      /* KIT/XP §6: HP numeric readout beside the heart row (mode toggle in settings). */
      .hprow{ position:relative; display:flex; align-items:center; gap:8px; }
      .hp-num{ font-family:var(--f-num); font-variant-numeric:tabular-nums; font-size:var(--fs-num); line-height:1; color:var(--cream); }
      .arena-hp{ position:relative; width:120px; height:12px; flex:0 0 120px; overflow:hidden;
        background:var(--dun-0); box-shadow:inset 0 0 0 2px var(--dun-3); }
      .arena-hp i{ position:absolute; inset:2px; transform:scaleX(1); transform-origin:left center;
        background:linear-gradient(180deg,#ff7a7a,var(--red)); box-shadow:0 0 6px rgba(255,90,90,.5);
        transition:transform .12s linear; }
      .arena-spawn-protection{ position:absolute; left:0; top:16px; width:120px; height:10px;
        display:flex; align-items:center; gap:5px; pointer-events:none; opacity:0; transform:translateY(-2px);
        transition:opacity .08s linear,transform .08s linear; }
      .arena-spawn-protection.show{ opacity:1; transform:translateY(0); }
      .arena-spawn-protection.final{ animation:spawn-protection-pulse .25s steps(2,end) infinite; }
      .arena-spawn-protection span{ width:68px; color:var(--cream); font-family:var(--f-ui);
        font-size:7px; line-height:1; letter-spacing:.5px; white-space:nowrap; }
      .arena-spawn-protection i{ position:relative; width:47px; height:5px; overflow:hidden;
        background:var(--dun-0); box-shadow:inset 0 0 0 1px var(--dun-3); }
      .arena-spawn-protection b{ position:absolute; inset:1px; transform:scaleX(var(--spawn-protection,0));
        transform-origin:left center; background:var(--amber); }
      .arena-spawn-protection.grace b{ background:repeating-linear-gradient(90deg,
        var(--amber) 0 9px,transparent 9px 11px); }
      .arena-spawn-protection.shield b{ opacity:.58; }
      @keyframes spawn-protection-pulse{ 50%{ opacity:.58; } }
      /* Teammate HP party panel (the Mender dependency): compact nameplate rows. */
      .party{ display:none; flex-direction:column; gap:3px; }
      .party.has-party{ display:flex; }
      .party-row{ display:flex; align-items:center; gap:6px; font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:1px; }
      .party-row.down{ opacity:.75; } .party-row.away{ opacity:.5; }
      .party-dot{ width:8px; height:8px; flex:0 0 auto; background:var(--dun-4); box-shadow:inset 0 0 0 1px rgba(0,0,0,.5); }
      .party-name{ min-width:42px; max-width:64px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--cream); text-transform:uppercase; }
      .party-bar{ position:relative; width:46px; height:7px; background:var(--dun-0); box-shadow:inset 0 0 0 1px var(--dun-3); }
      .party-bar i{ position:absolute; top:1px; left:1px; bottom:1px; width:calc((100% - 2px) * var(--pfill,1)); background:var(--grn); transition:width .12s linear; }
      .party-row.down .party-bar i{ background:var(--red,#ff5a5a); }
      .party-hp{ min-width:34px; font-variant-numeric:tabular-nums; color:var(--dun-4); }
      .statrow{ display:flex; gap:6px; align-items:center; }
      .chip{ display:inline-flex; align-items:center; gap:6px; background:var(--dun-1); box-shadow:inset 0 0 0 2px var(--dun-3); padding:3px 9px; }
      .chip .ic{ width:16px; height:16px; }
      .chip .v{ font-family:var(--f-num); font-size:var(--fs-num); line-height:1; margin-top:2px; color:var(--cream); }
      .chip .k{ font-family:var(--f-ui); font-size:var(--fs-xs); letter-spacing:1px; color:var(--dun-4); text-transform:uppercase; }
      .chip.floor .v{ color:var(--amber); } .chip.coins .v{ color:var(--amber-hi); } .chip.kills .v{ color:#ff8a8a; }
      /* Coin lands in the wallet: a transform-only pop (no layout shift). */
      .chip.coins{ transform-origin:left center; will-change:transform; }
      .chip.coins.coin-pop{ animation:coinPop .28s cubic-bezier(.2,1.6,.4,1); }
      @keyframes coinPop{ 0%{transform:scale(1);} 40%{transform:scale(1.22);} 100%{transform:scale(1);} }
      .coopstrip{ font-family:var(--f-ui); font-size:var(--fs-xs); letter-spacing:1px; color:var(--blu); background:rgba(5,3,11,.62); box-shadow:inset 0 0 0 2px var(--dun-3); padding:4px 9px; text-transform:uppercase; }
      /* Floor-mutator readout: collapsed off deep floors, so ordinary floors stay pristine and it
         only expands at a floor transition (never a mid-combat shift). */
      .mutators{ display:none; }
      .mutators.has-mutators{ display:block; font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:1px; color:var(--amber-lo); text-transform:uppercase; max-width:180px; }
      .minimap{ width:132px; height:96px; background:var(--dun-0); position:relative; box-shadow:0 0 0 3px var(--ink),inset 0 0 0 2px var(--amber-lo),0 0 14px rgba(255,180,59,.12); }
      .minimap .mm-title{ position:absolute; top:-9px; left:8px; font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:2px; color:var(--amber); background:var(--dun-0); padding:0 4px; z-index:1; }
      #minimap{ position:absolute; inset:3px; width:calc(100% - 6px); height:calc(100% - 6px); image-rendering:pixelated; display:block; }
      /* --- bottom-center hotbar (Minecraft-style): one slot per owned weapon --- */
      .hotbar{ position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
        display:flex; flex-direction:column; align-items:center; gap:7px; max-width:min(94vw,940px); }
      /* The slots row is pointer-enabled: click equips, drag reorders. Everything outside
         the slots/chips stays pointer-transparent so gameplay aim/fire is never blocked. */
      .hb-slots{ position:relative; display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-end; gap:6px; pointer-events:auto; }
      /* UI Director gate: the EQUIPPED slot is the dominant one — unequipped slots are the
         compact base size, the lit slot grows and lifts. */
      .hb-slot{ position:relative; width:66px; min-width:48px; min-height:48px; padding:9px 4px 7px;
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
        background:rgba(5,3,11,.72); box-shadow:inset 0 0 0 2px var(--dun-3),0 3px 0 rgba(0,0,0,.4);
        transition:transform .06s steps(2),box-shadow .06s steps(2),width .06s steps(2);
        cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none; }
      .hb-slot:hover{ box-shadow:inset 0 0 0 2px var(--dun-4),0 3px 0 rgba(0,0,0,.4); }
      /* focus = EXTERNAL dashed ring (distinct grayscale geometry — never a glow) */
      .hb-slot:focus-visible{ outline:var(--focus-ring); outline-offset:2px; }
      .hb-slot .hb-icon, .hb-slot .hb-icon img{ width:30px; height:30px; }
      /* equipped = lift + DOUBLE frame + top notch (geometry-first, grayscale-distinct;
         the old amber glow was nonsemantic ornament and is gone — combat outranks UI) */
      .hb-slot.on{ width:84px; background:var(--dun-2); transform:translateY(-4px);
        box-shadow:inset 0 0 0 2px var(--amber),inset 0 0 0 4px var(--dun-0),0 3px 0 rgba(0,0,0,.4); }
      .hb-slot.on::after{ content:""; position:absolute; top:-6px; left:50%; transform:translateX(-50%);
        width:10px; height:4px; background:var(--amber); box-shadow:0 0 0 1px var(--dun-0); }
      .hb-slot.on .hb-icon, .hb-slot.on .hb-icon img{ width:40px; height:40px; }
      /* Rarity frame tints (weapon drop-quality): rare = cool blue, legendary = gold.
         Commons keep the classic frame so the tint stays a signal. The equipped state's
         double frame wins the inner ring; rarity then rides the OUTER ring. */
      .hb-slot.r-rare{ box-shadow:inset 0 0 0 2px #3f6fae,0 3px 0 rgba(0,0,0,.4); }
      .hb-slot.r-legendary{ box-shadow:inset 0 0 0 2px var(--gold),0 3px 0 rgba(0,0,0,.4); }
      .hb-slot.r-rare:hover{ box-shadow:inset 0 0 0 2px #5a8fd4,0 3px 0 rgba(0,0,0,.4); }
      .hb-slot.r-legendary:hover{ box-shadow:inset 0 0 0 2px var(--gold-hi),0 3px 0 rgba(0,0,0,.4); }
      .hb-slot.on.r-rare{ box-shadow:inset 0 0 0 2px var(--amber),inset 0 0 0 4px var(--dun-0),0 0 0 2px #3f6fae,0 3px 0 rgba(0,0,0,.4); }
      .hb-slot.on.r-legendary{ box-shadow:inset 0 0 0 2px var(--amber),inset 0 0 0 4px var(--dun-0),0 0 0 2px var(--gold),0 3px 0 rgba(0,0,0,.4); }
      /* THE weapon-card tooltip: one root-level floating element (never a slot child, so
         no hotbar/drawer clipping and no per-slot duplicates), position:fixed and
         pointer-events:none, populated + anchored ~10px above the hovered/focused slot by
         Hud.showTipFor with 12px viewport clamps. Carries the HUD zoom so it scales with
         the bar; z 7 sits above the hotbar chrome and below scrim(8)/drawer(9)/menus(10). */
      .hb-tip{ position:fixed; left:0; top:0; z-index:7; display:none; pointer-events:none; zoom:var(--ui-scale,1);
        flex-direction:column; gap:3px; text-align:left; width:max-content; max-width:266px; overflow-wrap:anywhere;
        font-family:var(--f-num); font-size:var(--fs-md); line-height:1.15; color:var(--bone); background:var(--dun-1);
        box-shadow:var(--frame-soft),0 4px 0 rgba(0,0,0,.5); padding:6px 9px; }
      .hb-tip.show{ display:flex; }
      /* header = the strongest element on the card; everything below steps down. */
      .hb-tip .th{ display:flex; align-items:center; gap:6px; padding-bottom:3px; border-bottom:1px solid var(--dun-3); }
      .hb-tip .ti{ flex:none; width:20px; height:20px; display:flex; align-items:center; justify-content:center;
        background:var(--dun-0); box-shadow:inset 0 0 0 1px var(--dun-3); }
      .hb-tip .ti img{ width:16px; height:16px; image-rendering:pixelated; }
      .hb-tip .ti .glyphfb{ font-family:var(--f-num); font-size:var(--fs-sm); line-height:1; color:var(--cream); }
      .hb-tip .tn{ font-family:var(--f-ui); font-size:var(--fs-xs); letter-spacing:1px; color:var(--amber); }
      /* the rarity badge (header right): the tier word in its accent — text first, tint second */
      .hb-tip .tw{ margin-left:auto; font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:1px; color:var(--ink-mute); }
      .hb-tip .tw.rare{ color:#7fb8ff; }
      .hb-tip .tw.legendary{ color:var(--gold-bright); }
      .hb-tip .tj{ font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:2px; color:var(--amber-hi); margin-bottom:2px; }
      .hb-tip .tr{ display:flex; align-items:baseline; gap:7px; }
      .hb-tip .tk{ font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:1px; color:var(--dun-4); min-width:52px; }
      .hb-tip .tv{ color:var(--cream); }
      /* comparison tokens read by GLYPH + WORD first; the tint is the last channel. */
      .hb-tip .td{ font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:1px; align-self:center; }
      .hb-tip .td.up{ color:var(--grn); } .hb-tip .td.down{ color:var(--red); } .hb-tip .td.eq{ color:var(--ink-mute); }
      /* technique/tradeoff block sits behind a structural keyline, not a color wash. */
      .hb-tip .tm{ color:var(--blu); border-left:2px solid var(--dun-4); padding-left:6px; }
      .hb-tip .tm.gains{ color:var(--grn); } .hb-tip .tm.loses{ color:var(--red); } .hb-tip .tm.changes{ color:var(--amber); }
      .hb-tip .tx{ font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:1px; color:var(--amber); }
      /* drag/drop feedback (grayscale-distinct geometry, zero layout shift):
         - source slot: dimmed + diagonal hatch (never just a tint)
         - ghost: OPAQUE card, hard offset shadow, a MOVE tag — no glow, no equipped notch
         - insertion target: 4px bar with triangle caps — the FIRST-priority cue mid-drag.
         The ghost positions purely via its inline translate3d (transition:none so it never
         lags the pointer; origin 0 0 so the zoom-compensating scale() keeps its top-left
         at the exact pointer-minus-grab-offset point). */
      .hb-slot.dragging{ opacity:.35;
        background-image:repeating-linear-gradient(45deg, rgba(232,224,200,.28) 0 2px, transparent 2px 7px); }
      .hb-ghost{ position:fixed; left:0; top:0; z-index:9; margin:0; pointer-events:none;
        transition:none; transform-origin:0 0;
        background:var(--dun-2); box-shadow:inset 0 0 0 2px var(--amber-hi),0 5px 0 rgba(0,0,0,.55); }
      .hb-ghost::after{ display:none; } /* no equipped notch on the preview */
      .hb-ghost .hb-move{ position:absolute; top:-8px; left:50%; transform:translateX(-50%); padding:1px 4px;
        font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:1px; line-height:1;
        color:var(--dun-0); background:var(--amber-hi); box-shadow:0 0 0 1px var(--ink); }
      .hb-ins{ position:absolute; width:4px; background:var(--amber-hi); box-shadow:0 0 0 1px var(--ink); pointer-events:none; z-index:7; }
      .hb-ins::before, .hb-ins::after{ content:""; position:absolute; left:50%; transform:translateX(-50%);
        border-left:5px solid transparent; border-right:5px solid transparent; }
      .hb-ins::before{ top:-5px; border-top:5px solid var(--amber-hi); }
      .hb-ins::after{ bottom:-5px; border-bottom:5px solid var(--amber-hi); }
      /* nearest-slot reorder target: an amber-hi inset ring + a 2px lateral nudge that opens
         the gap the dragged weapon will land in (before -> nudge right, after -> left). The
         equipped variant keeps its translateY(-4px) lift. Transform-only, so no reflow. */
      .hb-slot.drop-target{ box-shadow:inset 0 0 0 2px var(--amber-hi),0 3px 0 rgba(0,0,0,.4); }
      .hb-slot.drop-target.nudge-before{ transform:translateX(2px); }
      .hb-slot.drop-target.nudge-after{ transform:translateX(-2px); }
      .hb-slot.on.drop-target.nudge-before{ transform:translateY(-4px) translateX(2px); }
      .hb-slot.on.drop-target.nudge-after{ transform:translateY(-4px) translateX(-2px); }
      /* drag-out-to-discard: crossing into the discard band flips the ghost to a red DROP
         read (grayscale + danger inset) as the pre-release warning; the MOVE tag reads DROP,
         or CAN'T DROP LAST when it's the only weapon owned (that release just cancels). */
      .hb-ghost.discard{ filter:grayscale(1); box-shadow:inset 0 0 0 2px var(--danger),0 5px 0 rgba(0,0,0,.55); }
      .hb-ghost.discard .hb-move{ color:var(--cream); background:var(--danger); box-shadow:0 0 0 1px var(--ink); }
      /* empty capacity boxes: the bar is always MAX_OWNED_WEAPONS slots wide, so the cap
         reads at a glance and a pickup fills a box instead of shifting the layout. Inert
         (no pointer events) and visually recessive next to real slots. */
      .hb-empty{ position:relative; width:66px; min-width:48px; min-height:48px; padding:9px 4px 7px; align-self:stretch;
        background:rgba(5,3,11,.42); box-shadow:inset 0 0 0 2px rgba(58,48,80,.6); pointer-events:none; }
      .hb-empty .hb-key{ opacity:.4; }
      /* the full-hotbar swap prompt: anchored ABOVE the bar (absolute — zero layout
         shift), pointer-enabled buttons only. Amber frame = an actionable state, not
         passive chrome. */
      .hb-swap{ position:absolute; bottom:calc(100% + 12px); left:50%; transform:translateX(-50%); z-index:7;
        display:none; flex-direction:column; align-items:center; gap:8px; padding:9px 12px 8px; pointer-events:auto;
        background:var(--dun-1); box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--amber),0 6px 0 rgba(0,0,0,.5); }
      .hb-swap.show{ display:flex; }
      .hs-head{ display:flex; align-items:center; gap:8px; font-family:var(--f-ui); font-size:var(--fs-xs); letter-spacing:1px; color:var(--cream); white-space:nowrap; }
      .hs-tag{ padding:2px 5px; background:var(--amber); color:var(--dun-0); }
      .hs-icon, .hs-icon img{ width:22px; height:22px; image-rendering:pixelated; }
      .hs-name{ color:var(--amber-hi); }
      .hs-row{ display:flex; align-items:center; gap:6px; }
      /* compact prompt buttons: opt OUT of the chunky menu button kit (min-width/clip-
         path/lift), these are hotbar-scaled chrome. */
      .hs-slot{ position:relative; width:44px; min-width:44px; height:44px; padding:0; border:0; cursor:pointer;
        display:inline-flex; align-items:center; justify-content:center;
        clip-path:none; text-shadow:none; transition:none;
        background:rgba(5,3,11,.72); box-shadow:inset 0 0 0 2px var(--dun-3),0 2px 0 rgba(0,0,0,.4); }

      .dash{ display:flex; align-items:center; gap:8px; background:rgba(5,3,11,.72); box-shadow:inset 0 0 0 2px var(--dun-3); padding:6px 11px; }

      /* KIT/XP §3+§6: the bottom-left kit CLUSTER — KIT badge -> ULT meter -> DASH meter, sharing

      .ultmeter .bar{ width:70px; height:9px; background:var(--dun-0); box-shadow:inset 0 0 0 2px var(--dun-3); position:relative; }

      .ultmeter .bar i{ position:absolute; top:2px; left:2px; bottom:2px; width:calc((100% - 4px) * var(--ult-fill,0));

      /* --- The one-time online name gate + the lobby's YOU confirmation --- */

      /* --- Patch's shop panel: the compact interact panel (world keeps rendering behind it).
         Anchored above the hotbar so it never covers the buyer or the pedestal row; the
         action row is the ONE purchase control, and its disabled states carry the exact
         copy matrix (NEED N MORE COINS / SOLD / OWNED / MAX LV / FULL HEALTH). The two
         non-buy groups must never look alike (incl. grayscale + color-blind): .broke is

         flat + check ("settled for you"). --- */
      .shop-panel { position: fixed; left: 50%; bottom: 118px; transform: translateX(-50%); z-index: 9; }
      .shop-panel.hidden { display: none; }
      .shop-card { width: 302px; background: #0d0819; color: var(--cream); padding: 12px 14px; text-align: left;

        color: var(--cream); background: color-mix(in srgb, var(--t, #ffb43b) 22%, #0d0819); box-shadow: inset 0 0 0 2px var(--t, #2a2140); }
      .shop-icon img { width: 36px; height: 36px; image-rendering: pixelated; }

      .shop-tag { color: var(--grn); box-shadow: inset 0 0 0 1px var(--grn); padding: 1px 5px; }

      .shop-buy { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; padding: 9px 10px; border: 0; cursor: pointer; font-family: var(--f-logo), monospace;
        font-size: var(--fs-sm); letter-spacing: 1px; color: var(--dun-0); background: var(--amber);
        box-shadow: inset 0 0 0 2px #05030b, 0 3px 0 rgba(5,3,11,0.5); }

      .shop-buy:focus-visible { outline:var(--focus-ring); outline-offset:2px; }

      .shop-buy .shop-buy-glyph { display: inline-flex; align-items: center; line-height: 1; }
      /* unaffordable = still for sale: amber OUTLINE (never filled, never the resolved grey) */
      .shop-buy.broke { background: #0d0819; color: var(--amber);
        box-shadow: inset 0 0 0 2px var(--amber), 0 3px 0 rgba(5,3,11,0.5); }
      /* settled for this viewer (sold/owned/max/full/spent): muted flat + check */
      .shop-buy.resolved { background: #241a38; color: var(--ink-mute);
        box-shadow: inset 0 0 0 2px #05030b, 0 3px 0 rgba(5,3,11,0.5); }
      .shop-foot { margin: 8px 0 0; font-size: var(--fs-2xs); letter-spacing: 1px; color: var(--ink-mute); text-align: center; min-height: 10px; }
      .shop-foot.bought { color: var(--grn); }
      .shop-card .hint { margin: 6px 0 0; font-size: var(--fs-2xs); letter-spacing: 1.5px; color: var(--dun-4); text-align: center; }

      /* === MENU SHELL (fixed-geometry launchpad) — overrides earlier menu rules ===
         The home shell renders SYNCHRONOUSLY before any auth/network work, so every box
         below carries explicit dimensions: the desktop shell is min(820px,94vw), the hero/
         body/foot own fixed heights, and hydration only ever swaps content INSIDE them. */
      .menu{ position:relative; z-index:1; background:#120a24; border:3px solid #05030b; box-shadow:inset 0 0 0 3px #2a2140,0 8px 0 rgba(5,3,11,.5);
        padding:20px 26px 18px; width:min(840px,94vw); max-width:none; max-height:calc(100vh - 20px); overflow:hidden auto;
        display:flex; flex-direction:column; gap:16px; align-items:stretch; }
      /* CANONICAL HOME GEOMETRY (Ian's pass — the blob is the CENTERED STAR above the
         wordmark): the shell is a grid of a TALL 300px hero row + minmax(0,1fr) body at
         height min(700px,100vh-40px), min-height 620px. The body boxes below stay the
         zero-CLS launchpad boxes. position:relative anchors the CUSTOMIZE corner chip. */
      .menu-home{ display:grid; grid-template-rows:300px minmax(0,1fr); gap:14px;
        height:min(732px,calc(100vh - 20px)); min-height:560px; position:relative; }
      /* --- THE HERO BLOB STAGE (identity showpiece — the menu's centered star) ---
         The hero is a CENTERED column stacked blob -> wordmark -> tagline: the big 200x200
         .blob-stage on top (the star), the logo below it (shrunk so the blob wins), then a
         one-line tagline. The stage holds a 160px canvas rendered by the shared
         CosmeticLoadout renderer with the calm idle (canvas-side blink/wave, capped) over a
         quiet radial plinth glow and a scaled ground-shadow ellipse — the blob STANDS, it
         never floats. Deliberate non-chrome: NO button affordance, NO amber fill, NO arrow,
         no CSS animation — PLAY ONLINE below stays the only amber-filled element and the
         first action. Every bound here is fixed from first paint, so cosmetics/loading
         never shift anything. */
      /* Explicit row AND column: the CUSTOMIZE chip shares this grid cell (grid-placed over
         the band), and auto-placement must never push the hero into an implicit column. */
      .home-hero{ grid-row:1; grid-column:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
        min-height:0; overflow:hidden; padding-bottom:12px; border-bottom:2px solid var(--dun-3); }
      .hero-mark{ display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; min-width:0; }
      /* The logo SHRINKS (clamp) so the blob is unmistakably the hero; intrinsic 1128x192,
         width attrs reserve the box before the file streams in. */
      .logo-img{ image-rendering:pixelated; height:clamp(30px,4.5vh,42px); width:auto; max-width:min(280px,80%); object-fit:contain; display:block; margin:0; filter:drop-shadow(0 0 16px rgba(255,180,59,.28)); }
      .home-hero .tag{ font-family:var(--f-ui); font-size:var(--fs-xs); line-height:1.4; letter-spacing:.5px; color:var(--ink-mute); max-width:520px; min-height:14px; text-transform:none; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      /* The live "players online" pill: a reserved, fixed-height line under the tagline.
         Invisible (opacity, NOT display) until a positive count lands, so 0/loading/offline
         never shifts the hero. The green dot is the design-system --grn (not an emoji). */
      .home-online{ display:flex; align-items:center; justify-content:center; gap:7px; height:16px; min-height:16px;
        font-family:var(--f-ui); font-size:var(--fs-xs); letter-spacing:.5px; color:var(--ink-mute); text-transform:none;
        opacity:0; }
      .home-online.on{ opacity:1; }
      .home-online .online-dot{ flex:0 0 8px; width:8px; height:8px; border-radius:50%; background:var(--grn);
        box-shadow:0 0 6px rgba(127,221,90,.7); }
      .home-online .online-text{ min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .home-hero .blob-stage{ position:relative; flex:none; width:200px; height:200px;
        background:transparent; box-shadow:none; display:flex; align-items:center; justify-content:center; }
      /* the radial plinth glow — a warmer pool so the hero reads as lit + present on the
         flat dark band, still low enough it never competes with the amber Play button */
      .home-hero .blob-stage::before{ content:""; position:absolute; inset:2px; border-radius:50%;
        background:radial-gradient(closest-side, rgba(255,180,59,.24), rgba(255,180,59,.09) 52%, transparent 80%); }
      /* the soft ground-shadow under the feet — lifted up to the contact point + blurred so
         the blob reads as STANDING, not floating over a detached hard ellipse */
      .home-hero .blob-stage::after{ content:""; position:absolute; left:50%; bottom:30px; width:104px; height:16px;
        transform:translateX(-50%); border-radius:50%; background:rgba(5,3,11,.6); filter:blur(3px); }
      .home-hero .blob-stage .blob-preview{ position:relative; z-index:1; width:160px; height:160px;
        image-rendering:pixelated; background:transparent; }
      /* The small closet door beside the blob — the natural place to tap your guy. Quiet
         secondary chrome. DOM-LAST (PLAY keeps first tab/reading order) but grid-placed
         INTO the hero row, anchored bottom-right of the band. */
      .stage-customize{ grid-row:1; grid-column:1; justify-self:end; align-self:end; margin:0 14px 14px 0;
        z-index:2; min-width:0; width:auto; font-size:var(--fs-2xs); letter-spacing:1px; padding:8px 10px; white-space:nowrap; }
      .body{ display:flex; gap:20px; align-items:stretch; }
      .home-body{ display:grid; grid-template-columns:1.22fr 0.78fr; gap:20px; flex:1; min-height:0; }
      .col-actions{ flex:1.15; display:flex; flex-direction:column; gap:11px; min-width:0; }
      /* Exact left rows: 82 online / 54 solo / 16 status / 154 glance (+ 3 x 10px gaps
         = 336, the body row under the 150px hero). */
      .home-left{ display:flex; flex-direction:column; gap:10px; min-width:0; }
      .home-left .btn-quick{ height:82px; flex:0 0 82px; padding:0 22px; }
      .home-left .play-solo{ height:54px; flex:0 0 54px; padding:0 22px; font-size:var(--fs-md); }
      .home-left .camp-enter{ height:46px; flex:0 0 46px; padding:0 18px; font-size:var(--fs-sm); flex-direction:row; align-items:center; justify-content:flex-start; gap:8px; }
      .home-left .camp-enter .sub{ font-family:var(--f-ui); font-weight:400; font-size:var(--fs-xs); letter-spacing:.3px; text-transform:none; opacity:.8; text-shadow:none; }
      .home-left .lb-preview{ margin-top:0; }

      /* ---- AMBER CAMP (WAVE 1): balance + the Kennel + convenience sinks ---- */
      .camp-screen{ width:min(720px,94vw); text-align:center; }
      .camp-body{ display:flex; flex-direction:column; gap:16px; margin:14px 0 4px; text-align:left; }
      .camp-balance{ display:flex; align-items:baseline; gap:8px; justify-content:center; padding:10px 0 2px; }
      .camp-amber-ic{ color:var(--amber); font-size:var(--fs-lg); }
      .camp-amber-val{ color:var(--amber); font-family:var(--f-title,monospace); font-size:28px; font-variant-numeric:tabular-nums; }
      .camp-amber-lbl{ color:var(--dun-4); letter-spacing:2px; text-transform:uppercase; font-size:var(--fs-xs); }
      .camp-section{ border:2px solid var(--dun-3); background:rgba(20,12,36,.5); padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
      .camp-h{ font-family:var(--f-ui); font-size:var(--fs-sm); letter-spacing:2px; text-transform:uppercase; color:var(--cream); margin:0; }
      .camp-kennel .muted{ margin:0; }
      .camp-grid{ display:flex; flex-wrap:wrap; gap:10px; }
      .camp-card{ flex:1 1 200px; min-width:180px; display:flex; flex-direction:column; gap:6px; padding:12px; border:2px solid var(--dun-3); background:rgba(10,6,20,.6); }
      .camp-card.owned{ border-color:var(--amber-lo); }
      .camp-card.poor{ opacity:.75; }
      .camp-card.locked{ opacity:.5; }
      .camp-card-name{ font-family:var(--f-ui); font-weight:700; letter-spacing:1px; color:var(--cream); }
      .camp-card-desc{ font-size:var(--fs-xs); color:var(--dun-4); }
      .camp-card-chip{ align-self:flex-start; color:var(--amber); font-size:var(--fs-xs); letter-spacing:1px; }
      .camp-node{ align-self:flex-start; padding:9px 16px; font-size:var(--fs-sm); }
      .camp-node.buyable{ background:var(--amber); color:#241708; }
      .camp-node.locked{ background:var(--c,#2a2140); opacity:.6; cursor:default; }
      .camp-dismiss{ align-self:flex-start; font-size:var(--fs-xs); padding:6px 12px; }
      .camp-note{ min-height:1.2em; margin:2px 0 0; color:var(--amber-hi); font-size:var(--fs-sm); letter-spacing:.3px; }
      .home-right{ flex:1; display:flex; flex-direction:column; gap:10px; min-width:0; border-left:2px solid var(--dun-3); padding-left:20px; }
      .col-h{ font-family:var(--f-ui); font-size:var(--fs-xs); letter-spacing:2px; color:var(--dun-4); text-transform:uppercase; text-align:left; }
      .btn-quick{ width:100%; flex-direction:column; gap:5px; padding:17px 22px; font-size:var(--fs-lg); min-width:0; }
      .btn-quick .sub{ font-family:var(--f-ui); font-weight:400; font-size:var(--fs-xs); letter-spacing:.3px; text-transform:none; opacity:.85; text-shadow:none; }
      .col-actions .play-solo{ width:100%; font-size:var(--fs-md); padding:15px 22px; min-width:0; }
      .actrow{ display:flex; gap:10px; } .actrow button{ flex:1; min-width:0; }
      /* Online match-mode toggle (CO-OP / ARENA): the selected side highlights like a kit card. */
      .mode-toggle{ margin-bottom:11px; }
      .mode-toggle .secondary.sel{ box-shadow: inset 0 0 0 2px var(--amber); background: rgba(255,180,60,.08); color: var(--cream); }
      /* TEMP PVP kill switch: ARENA shown but disabled (dim only — same box, zero layout shift). */
      .mode-toggle .secondary:disabled{ cursor:not-allowed; opacity:.5; }
      .mode-toggle .secondary:disabled:hover{ transform:none; --c:#2a2140; --c-hi:#46356b; --c-lo:#171227; --tx:#ffe9b0; }
      .namerow{ display:flex; flex-direction:column; gap:5px; align-items:stretch; text-align:left; }
      .namerow label{ font-family:var(--f-ui); font-size:var(--fs-xs); letter-spacing:2px; color:var(--dun-4); text-transform:uppercase; }
      .menu input[type=text]{ font-family:var(--f-num); font-size:var(--fs-num); letter-spacing:1px; padding:8px 12px; background:#0d0819; color:var(--cream); border:0; box-shadow:inset 0 0 0 2px var(--dun-3),inset 0 3px 6px rgba(0,0,0,.5); text-align:left; outline:none; width:100%; }
      .menu input::placeholder{ color:var(--dun-4); }
      /* --- Blob-color pick (right column identity) --- */
      .swatches{ display:flex; gap:7px; }
      .swatch{ flex:0 0 auto; width:26px; height:26px; min-width:0; padding:0; border:0; cursor:pointer; box-shadow:inset 0 0 0 2px rgba(5,3,11,.65); }
      .swatch:hover{ transform:translateY(-1px); box-shadow:inset 0 0 0 2px rgba(5,3,11,.65); }
      .swatch:active{ transform:translateY(1px); box-shadow:inset 0 0 0 2px rgba(5,3,11,.65); }
      .swatch.sel, .swatch.sel:hover{ box-shadow:inset 0 0 0 2px #05030b, inset 0 0 0 4px var(--cream); }
      /* --- Optional Google sign-in (right column identity) --- */
      
      .authrow{ display:flex; flex-direction:column; gap:5px; align-items:stretch; }
      .btn-google{ display:flex; align-items:center; justify-content:center; gap:9px; width:100%; font-size:var(--fs-sm); padding:9px 12px; min-width:0; text-transform:none; letter-spacing:1px; }
      .btn-google svg{ display:block; flex:0 0 auto; }
      .auth-status{ font-size:var(--fs-sm); color:var(--red); text-align:left; min-height:12px; margin:0; }
      .auth-status:empty{ display:none; }
      .account{ display:flex; align-items:center; gap:10px; background:#0d0819; box-shadow:inset 0 0 0 2px var(--dun-3); padding:8px 10px; }
      .account-av{ flex:0 0 auto; width:32px; height:32px; background:var(--dun-3); box-shadow:inset 0 0 0 2px var(--dun-4); image-rendering:auto; object-fit:cover; }
      .account-av.has-img{ background:transparent; }
      .account-info{ display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; text-align:left; }
      .account-name{ font-family:var(--f-ui); font-size:var(--fs-sm); color:var(--cream); letter-spacing:.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .account-sub{ font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:1px; color:var(--dun-4); text-transform:uppercase; }
      .account-out{ flex:0 0 auto; font-size:var(--fs-xs); padding:6px 9px; min-width:0; text-transform:uppercase; }
      .profile{ display:flex; flex-direction:column; gap:8px; align-items:stretch; }
      .profile:empty{ display:none; }
      .profile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
      .stat{ background:#0d0819; box-shadow:inset 0 0 0 2px var(--dun-3); padding:6px 9px; display:flex; flex-direction:column; gap:1px; align-items:flex-start; }
      .stat-value{ font-family:var(--f-num); font-size:var(--fs-num); color:var(--cream); line-height:1; }
      .stat-value.amber{ color:var(--amber); }
      .stat-label{ font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:1px; color:var(--dun-4); text-transform:uppercase; }
      /* === TABBED SETTINGS (shared by the title Settings screen AND the pause overlay) ===
         A role=tablist strip over a fixed-height body that shows ONE category at a time.
         Switching tabs swaps the body inside the fixed region (the outer box never resizes),
         rows are a fixed height, the slider value has a reserved width, and the toggle is a
         fixed-size pill — so nothing shifts. Wide title panel goes two-col; pause is one-col. */
      .settings{ display:flex; flex-direction:column; gap:0; margin:0; }
      .set-tabs{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:10px 0; }
      .set-tab{ min-width:0; width:100%; font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:1px; padding:9px 4px;
        color:var(--ink-mute); background:var(--dun-1); box-shadow:inset 0 -2px 0 transparent;
        clip-path:none; text-shadow:none; transition:none; }
      .set-tab:hover{ transform:none; background:var(--dun-2); box-shadow:inset 0 -2px 0 var(--dun-4); color:var(--cream); }
      .set-tab:active{ transform:none; }
      /* Selected tab = amber underline + inset frame (geometry + color, not hue-only). */
      .set-tab[aria-selected=true]{ color:var(--amber-hi); background:var(--dun-2);
        box-shadow:inset 0 -2px 0 var(--amber), inset 0 0 0 2px var(--dun-3); }
      .set-body{ height:212px; overflow-y:auto; scrollbar-gutter:stable; display:flex; flex-direction:column; gap:8px; padding:2px; }
      .set-body.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:8px 18px; align-content:start; }
      /* ONE control-row component for every setting. */
      .set-row{ display:grid; grid-template-columns:1fr auto; align-items:center; gap:12px; min-height:40px; padding:6px 10px;
        background:rgba(5,3,11,.35); box-shadow:inset 0 0 0 1px var(--dun-3); }
      .set-row.is-muted{ opacity:.45; }
      .set-label{ display:flex; flex-direction:column; gap:1px; text-align:left; min-width:0; }
      .set-label .lab{ font-family:var(--f-ui); font-size:var(--fs-sm); letter-spacing:.5px; color:var(--cream); text-transform:uppercase; }
      .set-label .sub{ font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:.3px; color:var(--ink-mute); text-transform:none; }
      /* TOGGLE: a compact right-aligned pill — knob position + ON/OFF text carry the state. */
      .set-switch{ display:inline-flex; align-items:center; gap:8px; min-width:0; padding:4px 2px; border:0; cursor:pointer;
        background:transparent; box-shadow:none; clip-path:none; text-shadow:none; transition:none; }
      .set-switch:hover, .set-switch:active{ transform:none; background:transparent; box-shadow:none; }
      .set-switch-track{ position:relative; width:40px; height:20px; flex:0 0 auto; background:var(--dun-2); box-shadow:inset 0 0 0 2px var(--dun-3); }
      .set-switch-knob{ position:absolute; top:2px; left:2px; width:16px; height:16px; background:var(--ink-mute); transition:left .08s steps(2), background .08s; }
      .set-switch[aria-checked=true] .set-switch-track{ background:var(--amber); box-shadow:inset 0 0 0 2px var(--amber-hi); }
      .set-switch[aria-checked=true] .set-switch-knob{ left:22px; background:var(--dun-0); }
      .set-switch-txt{ font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:1px; color:var(--ink-mute); min-width:22px; text-align:left; }
      .set-switch[aria-checked=true] .set-switch-txt{ color:var(--amber-hi); }
      /* SLIDER: range + a FIXED-width value readout (no row shift on drag). */
      .set-slider{ display:flex; align-items:center; gap:10px; }
      .set-slider input[type=range]{ width:118px; }
      .set-val{ font-family:var(--f-num); font-size:var(--fs-num); color:var(--amber); min-width:46px; text-align:right; font-variant-numeric:tabular-nums; }
      /* CYCLE: a small ‹ VALUE › stepper. */
      .set-cycle{ display:inline-flex; align-items:center; gap:6px; }
      .set-step{ min-width:26px; width:26px; height:28px; padding:0; font-family:var(--f-num); font-size:var(--fs-num); color:var(--cream);
        background:var(--dun-2); box-shadow:inset 0 0 0 2px var(--dun-3); clip-path:none; text-shadow:none; transition:none; }
      .set-step:hover{ transform:none; background:var(--dun-3); box-shadow:inset 0 0 0 2px var(--dun-4); }
      .set-step:active{ transform:none; }
      .set-cycle-v{ font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:1px; color:var(--amber-hi); min-width:42px; text-align:center; text-transform:uppercase; }
      /* KEYBIND: a keycap-styled button showing the bound key; "listening" while capturing. */
      .set-keybind{ min-width:72px; height:28px; padding:0 10px; font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:1px;
        color:var(--amber-hi); background:var(--dun-2); box-shadow:inset 0 0 0 2px var(--dun-3); clip-path:none; text-shadow:none; transition:none; cursor:pointer; }
      .set-keybind:hover{ transform:none; background:var(--dun-3); box-shadow:inset 0 0 0 2px var(--dun-4); }
      .set-keybind.listening{ color:var(--dun-0); background:var(--amber); box-shadow:inset 0 0 0 2px var(--amber-hi); }
      /* Reserved single-line note (mute explainer / photosensitivity) — spans both columns. */
      .set-note{ grid-column:1 / -1; min-height:14px; margin:0; font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:.5px; color:var(--amber); }
      /* Reduced motion: the knob snaps instead of sliding. */
      @media (prefers-reduced-motion: reduce){ .set-switch-knob{ transition:none; } }
      /* square pixel-kit track inside the menu shell (overrides the rounded base track) */
      .menu input[type=range]{ width:100%; }
      .menu input[type=range]::-webkit-slider-runnable-track{ border-radius:0; }
      .menu input[type=range]::-moz-range-track{ border-radius:0; }
      .foot{ font-family:var(--f-ui); font-size:var(--fs-xs); letter-spacing:.5px; color:var(--dun-4); text-align:center; text-transform:none; min-height:20px; padding-top:6px; border-top:2px solid var(--dun-3); margin:0; }
      /* FINAL RESPONSIVE CONTRACT — <=680px width: ONE column with FIXED mobile rows
         (identity stays 176, destinations stay 90); the glance stays exactly 3 rows at a
         fixed 142px (5 pad + 18 head + 4 gap + 88 rows + 4 gap + 18 state + 5 pad). */
      @media (max-width:680px){
        .menu-home{ height:auto; min-height:0; grid-template-rows:auto auto; }
        .set-body.two-col{ grid-template-columns:1fr; }
        .body{ flex-direction:column; }
        .home-body{ grid-template-columns:1fr; }
        /* Narrow: a 240px hero row with a 150px stage (128px blob), PLAY still immediately
           below and the first action above the fold. */
        .menu-home{ grid-template-rows:240px minmax(0,1fr); }
        .home-hero{ gap:6px; }
        .logo-img{ height:clamp(28px,4vh,36px); }
        .home-hero .blob-stage{ width:150px; height:150px; }
        .home-hero .blob-stage .blob-preview{ width:128px; height:128px; }
        .home-hero .blob-stage::after{ bottom:18px; width:70px; height:11px; }
        .stage-customize{ margin:0 10px 10px 0; }
        .home-right{ border-left:0; border-top:2px solid var(--dun-3); padding-left:0; padding-top:14px; }
        /* .home-left carries the specificity so the later base .lb-preview rule can't
           override this media block (source order vs cascade). */
        .home-left .lb-preview{ height:142px; padding:5px 10px; gap:4px; }
        .home-right .identity-card{ height:108px; flex:0 0 108px; }
      }
      /* Short viewports (accepted responsive spec): a compact 180px hero row with a
         120px stage (96px blob) so PLAY + the leaderboard preview stay visible without
         scrolling Play off-screen; the shell follows content and never hides the glance. */
      @media (max-height:759px){
        .menu-home{ height:auto; min-height:0; grid-template-rows:240px minmax(0,1fr); }
        .home-hero{ gap:6px; }
        .logo-img{ height:clamp(26px,3.5vh,34px); }
        .home-hero .blob-stage{ width:150px; height:150px; }
        .home-hero .blob-stage .blob-preview{ width:128px; height:128px; }
        .home-hero .blob-stage::after{ bottom:16px; width:70px; height:11px; }
        .stage-customize{ margin:0 10px 8px 0; }
        .home-left .lb-preview{ height:140px; }
      }
      @media (max-height:619px){
        .menu-home{ height:auto; min-height:0; grid-template-rows:180px minmax(0,1fr); }
        .home-hero{ gap:6px; }
        .logo-img{ height:clamp(26px,3.5vh,32px); }
        .home-hero .blob-stage{ width:120px; height:120px; }
        .home-hero .blob-stage .blob-preview{ width:96px; height:96px; }
        .home-hero .blob-stage::after{ bottom:14px; width:56px; height:9px; }
        .stage-customize{ margin:0 10px 8px 0; }
      }

      /* === TITLE HIERARCHY + DESTINATIONS (menu/identity redesign) ===
         Attention order is explicit: (1) the amber PLAY actions, (2) the identity card +
         top-runs preview in quiet panel chrome, (3) the destination row and footline.
         Every async region (auth, stats, leaderboard) OWNS its final geometry from first
         paint — skeletons fill in place, so hydration causes no layout shift and no
         click-target movement. */
      /* Skeletons are QUIET: a static muted block, no animation anywhere on the shell. */
      .skel{ position:relative; color:transparent !important; background:var(--dun-2); box-shadow:inset 0 0 0 1px var(--dun-3); min-width:64px; opacity:.7; }

      /* --- the top-runs GLANCE (left column, under PLAY) — the accepted FIXED shape ---
         Total panel height is EXACTLY 154px, composed top to bottom:
           9 pad + 18 head + 6 gap + (3 rows x 28 + 2 x 2 row-gap = 88) + 6 gap + 18 state + 9 pad
         Dark, quiet, no animation, no amber fill — only the #1 rank numeral wears amber.
         Every box exists from first paint; hydration replaces contents only. */
      .lb-preview{ display:flex; flex-direction:column; gap:6px; margin-top:7px; height:154px; padding:9px 10px;
        box-shadow:inset 0 0 0 1px var(--dun-3); }
      .lb-head{ display:flex; align-items:center; gap:8px; height:18px; flex:0 0 18px; }
      .lb-head .col-h{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .lb-rows{ display:flex; flex-direction:column; gap:2px; }
      .lb-row{ display:flex; align-items:center; gap:8px; width:100%; min-width:0; height:28px; flex:0 0 28px; padding:0 8px;
        font-family:var(--f-ui); font-size:var(--fs-sm); letter-spacing:.5px; text-transform:none; text-align:left;
        color:var(--ink-mute); background:transparent; clip-path:none;
        box-shadow:inset 0 0 0 1px var(--dun-2); text-shadow:none; transition:none; }
      .lb-row:hover:not(:disabled){ background:var(--dun-1); transform:none; box-shadow:inset 0 0 0 1px var(--dun-4); color:var(--cream); }
      .lb-row:active:not(:disabled){ transform:none; box-shadow:inset 0 0 0 1px var(--dun-4); }
      .lb-row:disabled{ cursor:default; }
      .lb-row:focus-visible{ outline:var(--focus-ring); outline-offset:2px; }
      .lb-rank{ flex:0 0 16px; font-family:var(--f-num); font-size:var(--fs-md); color:var(--dun-4); text-align:right; }
      /* The one permitted warm accent in the glance: the #1 numeral. */
      .lb-rows .lb-row:nth-child(1) .lb-rank{ color:var(--amber); }
      .lb-dot{ flex:0 0 9px; width:9px; height:9px; background:var(--dun-3); }
      .lb-name{ flex:1; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; min-height:12px; }
      .lb-floor{ flex:0 0 auto; font-family:var(--f-num); font-size:var(--fs-md); color:var(--ink-mute); min-width:48px; text-align:right; }
      /* The ONE fixed 18px state line: board-level states (offline/empty) outrank the
         player's own out-of-rows rank readout; single line, ellipsized, never wraps. */
      .menu p.lb-standing{ height:18px; flex:0 0 18px; font-family:var(--f-ui); font-size:var(--fs-xs); letter-spacing:.3px;
        color:var(--ink-mute); text-transform:none; line-height:18px; margin:0; text-align:left;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      /* The full LEADERBOARD destination keeps the readable panel treatment + its own
         two-line reserved note (`.menu p` specificity so p.muted sizing can't overflow it). */
      .menu p.lb-note{ min-height:30px; font-size:var(--fs-sm); line-height:1.5; margin:0; text-align:left; }
      .lb-rows-full .lb-row{ height:38px; flex:0 0 38px; background:var(--dun-1); box-shadow:inset 0 0 0 1px var(--dun-3); color:var(--cream); }
      .lb-rows-full .lb-floor{ color:var(--amber-hi); }
      /* --- FULL LEADERBOARD rich stat columns (full board only; the title glance stays a
         quiet name + floor). The header row and the data rows share these column widths so
         values line up under their labels; padding/gap match .lb-row exactly. --- */
      .lb-weapon{ flex:0 0 88px; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
        text-align:right; font-family:var(--f-ui); font-size:var(--fs-xs); letter-spacing:.3px; color:var(--dun-4); }
      .lb-kills, .lb-coins, .lb-time{ flex:0 0 52px; min-width:0; text-align:right;
        font-family:var(--f-num); font-size:var(--fs-md); color:var(--ink-mute); }
      .lb-rows-full .lb-kills{ color:var(--cream); }
      .lb-rows-full .lb-coins{ color:var(--gold-hi); }
      .lb-colhead{ display:flex; align-items:center; gap:8px; width:100%; padding:2px 8px 0; height:16px; flex:0 0 16px;
        font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:1px; color:var(--dun-4); text-transform:uppercase; }
      .lb-colhead span{ font-family:var(--f-ui); font-size:var(--fs-2xs); color:var(--dun-4); }
      .lb-colhead .lb-name{ text-align:left; }
      .lb-colhead .lb-arrow{ color:transparent; }
      .lb-dot-ghost{ background:transparent; }


      /* --- reserved identity card (right column): guest CTA and account chip share ONE
         geometry so signed-in/out/loading/error never move anything below --- */
      /* FINAL identity-card geometry: 112px desktop / 108px mobile, one reserved box for
         guest / busy / error / signed-in — content swaps only. Right grid = 112/82/82 with
         10px gaps. Junior to Play by construction: dark chrome, no amber fill/pulse/glow. */
      /* The login card: one 42px+1fr, three-track grid for every state — the fixed 40px
         bright icon patch (Google mark / avatar), title + value, then the full-width
         action strip + note. Dark chrome, secondary purple CTA, no amber/glow/animation;
         focus rings are EXTERNAL (the global button outline). */
      .identity-card{ display:grid; grid-template-columns:42px 1fr; grid-template-rows:auto auto 1fr; gap:4px 8px;
        height:112px; flex:0 0 112px; overflow:hidden;
        padding:9px 10px; background:#0d0819; box-shadow:inset 0 0 0 2px var(--dun-3); }
      /* The guest frame reads stronger than an ordinary panel — still dark, never warm. */
      .identity-card.guest{ box-shadow:inset 0 0 0 2px var(--dun-4); }
      .id-patch{ grid-column:1; grid-row:1 / span 2; width:40px; height:40px; background:#f4f2ec;
        display:flex; align-items:center; justify-content:center; box-shadow:inset 0 0 0 2px #05030b; }
      .id-patch svg{ display:block; width:22px; height:22px; }
      .id-avatar{ display:block; width:40px; height:40px; object-fit:cover; image-rendering:auto; }
      .id-title{ grid-column:2; grid-row:1; font-family:var(--f-ui); font-size:var(--fs-sm); letter-spacing:1px; color:var(--cream); text-transform:uppercase; text-align:left;
        height:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .menu p.id-value{ grid-column:2; grid-row:2; font-family:var(--f-ui); font-size:var(--fs-xs); letter-spacing:.2px; color:var(--ink-mute); text-transform:none; line-height:12px; margin:0; text-align:left; height:24px; overflow:hidden; }
      .id-actions{ grid-column:1 / -1; grid-row:3; align-self:end; display:flex; flex-direction:column; gap:4px; min-width:0; }
      .id-view{ min-width:0; width:100%; font-size:var(--fs-xs); padding:0 8px; height:28px; letter-spacing:1px; }
      .menu p.id-note{ font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:.2px; color:var(--dun-4); text-transform:none; line-height:12px; height:12px; flex:0 0 12px; margin:0; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      /* Mid-OAuth placeholder: the identity card's "signing you in" state, centered in the
         same reserved box the chip/CTA occupy — it settles in place when the exchange ends. */
      .menu p.id-pending{ margin:auto; text-align:center; color:var(--cream); white-space:normal; height:auto; flex:1; }
      /* The CTA is a SECONDARY (dark) control — never an amber/warm fill, no animation. */
      .btn-google{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; font-size:var(--fs-xs); padding:0 10px; min-width:0; height:28px; flex:0 0 28px; letter-spacing:1px; }
      .auth-status{ font-size:var(--fs-sm); color:var(--red); text-align:left; min-height:12px; margin:0; }
      /* Reserved status/failure line on action screens (online home, join code): busy,
         error, and retry copy swap INSIDE this box — the buttons around it never move. */
      .status-line{ min-height:36px; margin:0; display:flex; align-items:center; justify-content:center; gap:12px; }
      /* Compact TRY AGAIN inside the reserved status line (retryable invite failure only):
         sized to fit the 36px box, so its presence never moves the buttons around it. */
      .status-line .status-retry{ font-size:var(--fs-xs); letter-spacing:1px; padding:6px 12px; min-height:0; }

      .you-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; text-align:left; }
      .you-name{ font-family:var(--f-ui); font-size:var(--fs-sm); color:var(--cream); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .you-stats{ font-family:var(--f-ui); font-size:var(--fs-xs); color:var(--ink-mute); min-height:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      /* The fixed home status line: reserved from first paint (boot/exit notes swap
         content inside it; single line, ellipsized). */
      .menu p.home-status{ height:16px; flex:0 0 16px; font-family:var(--f-ui); font-size:var(--fs-xs); letter-spacing:.3px;
        color:var(--ink-mute); text-transform:none; line-height:16px; margin:0; text-align:left;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      /* --- THE UNIFORM DESTINATION NAV (Ian's pass — kills the "scattered" read) ---
         Every right-column utility (PROFILE / LEADERBOARD / SETTINGS / WHAT'S NEW) is the
         EXACT same .dest component: full width, 56px tall, a 28px icon / label+sub / 16px
         arrow grid. Same size, same type, same padding — no mixed one-offs. Stacked with
         10px gaps and top-aligned under the identity card. */
      .navrow{ display:flex; flex-direction:column; gap:10px; }
      .dest{ position:relative; height:56px; flex:0 0 56px; min-width:0; width:100%; padding:0 14px;
        display:grid; grid-template-columns:28px 1fr 16px; align-items:center; gap:10px;
        font-size:var(--fs-sm); letter-spacing:1px; text-align:left; }
      .dest .dest-ic{ font-family:var(--f-num); font-size:var(--fs-lg); line-height:1; color:var(--ink-mute); text-align:center; }
      .dest:hover .dest-ic, .dest:focus-visible .dest-ic{ color:var(--cream); }
      .dest .dest-main{ display:flex; flex-direction:column; gap:1px; min-width:0; }
      .dest .dest-label{ font-family:var(--f-ui); letter-spacing:1px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .dest .dest-sub{ font-family:var(--f-ui); font-weight:400; font-size:var(--fs-2xs); letter-spacing:.3px; text-transform:none; opacity:.8; text-shadow:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .dest .dest-arrow{ font-family:var(--f-num); font-size:var(--fs-lg); line-height:1; color:var(--dun-4); text-align:center; }
      .dest:hover .dest-arrow, .dest:focus-visible .dest-arrow{ color:var(--cream); }
      /* WHAT'S NEW unread cue rides the SAME .dest: an 8px amber SQUARE pixel dot at the
         corner PLUS a grayscale-distinct NEW chip (amber plate + dun-0 glyph) in the sub
         line — never hue-only. Both hidden when caught up; reserved by the sub row so the
         layout never shifts. */
      .dest .wn-dot{ position:absolute; top:-3px; right:-3px; width:8px; height:8px; background:var(--amber); box-shadow:0 0 0 1px var(--dun-0); }
      .dest .wn-new{ display:inline-block; font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:1px; color:var(--dun-0); background:var(--amber); padding:1px 4px; }

      /* --- profile screens (the shared fixed card + the own wardrobe) --- */
      /* Worn title under the name: reserved line, so titled and untitled render at the
         same height and equipping a title never shifts the screen. */
      .worn-title{ min-height:15px; font-family:var(--f-ui); font-size:var(--fs-sm); letter-spacing:1px; color:var(--amber-hi); text-transform:none; margin:0; }
      /* THE PROFILE CARD: one fixed ~640x430 surface for every profile (own Overview and
         the read-only player view). Attention order: appearance/name (left) -> ranked top
         run + exact build (right, top) -> lifetime (right, bottom). Every region is
         reserved; loading/private/no-snapshot swap content inside identical boxes. */
      .pc-context{ text-align:center; }
      .profile-card{ width:min(640px,100%); height:430px; margin:0 auto; display:flex; gap:20px; padding:16px;
        background:#0d0819; box-shadow:inset 0 0 0 2px var(--dun-3); text-align:left; }
      .pc-left{ flex:0 0 192px; display:flex; flex-direction:column; gap:7px; min-width:0; }
      .blob-stage{ flex:0 0 192px; width:192px; height:192px; background:var(--dun-0);
        box-shadow:inset 0 0 0 2px var(--dun-3); display:flex; align-items:center; justify-content:center; }
      .blob-stage .blob-preview{ width:192px; height:192px; image-rendering:pixelated; }
      .pc-name{ font-family:var(--f-ui); font-size:var(--fs-md); letter-spacing:1px; color:var(--cream);
        min-height:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .pc-rank{ min-height:14px; font-family:var(--f-ui); font-size:var(--fs-xs); letter-spacing:.3px; color:var(--ink-mute);
        text-transform:none; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      /* Owner-only slot (name editor + CUSTOMIZE BLOB); reserved on read-only profiles
         too, so both variants share byte-identical card geometry. */
      .pc-left-slot{ min-height:40px; display:flex; flex-direction:column; gap:8px; justify-content:flex-end; }
      .pc-customize{ width:100%; min-width:0; font-size:var(--fs-xs); padding:10px 8px; letter-spacing:1px; }
      /* The editable blob name (own Overview): guests edit + SAVE anytime through the
         same sanitized login path; signed-in goes read-only (the server names accounts
         from Google). Fixed rows — 12 label / 30 field / 12 note — inside the card. */
      .pc-nameedit{ width:100%; display:flex; flex-direction:column; gap:4px; }
      .pc-nameedit > .col-h{ height:12px; }
      .pc-namerow{ display:flex; gap:6px; }
      .menu input[type=text].pc-nameinput{ flex:1 1 0; min-width:0; width:auto; height:30px; font-size:var(--fs-md); padding:4px 8px; }
      .pc-nameinput:disabled{ color:var(--ink-mute); }
      .pc-name-save{ flex:0 0 auto; min-width:52px; height:30px; font-size:var(--fs-xs); padding:0 10px; letter-spacing:1px; }
      .menu p.pc-name-note{ font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:.2px; color:var(--dun-4); text-transform:none;
        line-height:12px; height:12px; margin:0; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .pc-right{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
      .pc-run{ grid-template-columns:1fr 1fr 1fr 1fr; }
      .pc-run .stat-value{ font-size:var(--fs-lg); }
      .pc-build{ height:64px; overflow-y:auto; align-content:flex-start; justify-content:flex-start; }
      .pc-lifetime{ min-height:56px; }
      .pc-life{ grid-template-columns:1fr 1fr 1fr 1fr; }
      .pc-life .stat-value{ font-size:var(--fs-md); }
      .pc-life-note{ margin:0; font-size:var(--fs-sm); text-align:left; }
      .pc-account{ display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; min-height:52px; }
      .pc-signin{ width:auto; min-width:220px; }
      .pc-tabs{ display:flex; gap:8px; justify-content:center; }
      .pc-tab{ min-width:120px; font-size:var(--fs-xs); padding:9px 12px; letter-spacing:1px; }
      .pc-tab.on{ box-shadow:inset 0 0 0 2px var(--amber), 0 0 0 0 transparent; color:var(--amber-hi); }
      .lb-arrow{ flex:0 0 auto; font-family:var(--f-num); font-size:var(--fs-md); color:var(--dun-4); }
      .lb-row:hover:not(:disabled) .lb-arrow, .lb-row:focus-visible .lb-arrow{ color:var(--cream); }
      @media (max-width:680px){
        .profile-card{ height:auto; flex-direction:column; align-items:center; }
        .pc-left{ align-items:center; text-align:center; }
      }
      .pp-top{ display:flex; gap:18px; align-items:center; justify-content:center; }
      .pp-top .blob-preview{ flex:0 0 96px; width:96px; height:96px; image-rendering:pixelated;
        background:#0d0819; box-shadow:inset 0 0 0 2px var(--dun-3); }
      .pp-top .profile-grid{ flex:0 1 320px; }
      .build-strip{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; min-height:24px; }
      .build-chip{ font-family:var(--f-ui); font-size:var(--fs-xs); letter-spacing:.5px; color:var(--cream); padding:5px 8px;
        background:#0d0819; box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--t,var(--dun-4)) 75%, var(--dun-3)); }
      .build-chip.weapon{ color:var(--amber-hi); box-shadow:inset 0 0 0 1px var(--amber-lo); }
      /* --- THE CLOSET: a fixed panel (stage | categories + grid + inline message line).
         INSTANT EQUIP — no action strip, no save step, nothing to discard. Card states
         (.cos-card owned|equipped|locked) are carried by GEOMETRY + GLYPH + TEXT, never
         hue alone: equipped lifts 3px with the amber DOUBLE frame, the persistent .cos-
         check badge and the EQUIPPED chip; locked wears the hatch overlay, the .cos-lock
         glyph, a desaturated thumb and its exact condition as the chip (still focusable
         so the condition is readable); NEW wears the one-visit chip; the in-flight write
         rides a tiny .cos-saving corner spinner. */
      .closet-panel{ display:flex; gap:16px; width:min(640px,100%); height:430px; margin:0 auto; padding:14px;
        background:#0d0819; box-shadow:inset 0 0 0 2px var(--dun-3); text-align:left; }
      .closet-stage{ flex:0 0 128px; display:flex; flex-direction:column; gap:6px; align-items:center; }
      .closet-stage .blob-preview{ width:128px; height:128px; image-rendering:pixelated;
        background:var(--dun-0); box-shadow:inset 0 0 0 2px var(--dun-3); }
      .closet-right{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
      .closet-cats{ display:flex; gap:6px; flex:0 0 30px; }
      .closet-cat{ flex:1; min-width:0; font-size:var(--fs-2xs); padding:8px 4px; letter-spacing:1px; }
      .closet-cat.on{ box-shadow:inset 0 0 0 2px var(--cream); color:var(--cream); }
      .closet-grid{ flex:1; min-height:0; display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start; overflow-y:auto; }
      .cos-card{ position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; width:96px; min-width:72px; height:104px; padding:10px 4px 6px;
        text-transform:none; letter-spacing:0; clip-path:none; text-shadow:none; cursor:pointer;
        background:var(--dun-1); color:var(--cream); box-shadow:inset 0 0 0 2px var(--dun-3); transition:none; }
      .cos-card.owned:hover{ transform:none; background:var(--dun-2); box-shadow:inset 0 0 0 2px var(--dun-4); }
      .cos-card:active{ transform:none; }
      /* equipped: 3px lift + amber DOUBLE frame + the .cos-check badge (geometry first —
         the lift/frame/badge/chip survive grayscale and every color-vision deficiency). */
      .cos-card.equipped, .cos-card.equipped:hover{ transform:translateY(-3px); background:var(--dun-2);
        box-shadow:inset 0 0 0 2px var(--amber), inset 0 0 0 4px var(--dun-0); }
      .cos-check{ position:absolute; top:3px; right:3px; width:14px; height:14px; display:flex; align-items:center; justify-content:center;
        font-family:var(--f-num); font-size:var(--fs-sm); line-height:1; color:var(--dun-0); background:var(--amber); box-shadow:0 0 0 1px var(--ink); }
      /* locked: hatch overlay + lock glyph + desaturated thumb; NOT equippable but still
         focusable, so the condition chip is readable by keyboard/pad/screen reader. */
      .cos-card.locked{ cursor:default; color:var(--ink-mute); }
      /* Hover must NOT warm a locked card (the global button:hover would win otherwise —
         locked cards are enabled so their condition stays focusable/readable). */
      .cos-card.locked:hover{ transform:none; background:var(--dun-1); box-shadow:inset 0 0 0 2px var(--dun-3); }
      .cos-card.locked::after{ content:""; position:absolute; inset:0; pointer-events:none;
        background-image:repeating-linear-gradient(45deg, rgba(5,3,11,.4) 0 2px, transparent 2px 7px); }
      .cos-card.locked .cos-icon{ filter:grayscale(1) brightness(.7); }
      /* CSS-drawn padlock (font-independent): body square + shackle. */
      .cos-lock{ position:absolute; top:8px; right:5px; width:10px; height:7px; background:var(--ink-mute); }
      .cos-lock::before{ content:""; position:absolute; top:-5px; left:2px; width:2px; height:3px;
        border:2px solid var(--ink-mute); border-bottom:0; }
      /* focus: EXTERNAL cream stepped ring — distinct from the equipped amber double frame. */
      .cos-card:focus-visible{ outline:var(--focus-ring); outline-offset:2px; }
      .cos-icon{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:var(--fs-lg); color:var(--dun-4); }
      .cos-icon canvas{ image-rendering:pixelated; }
      /* Blob-color swatches always ride with their .cos-name label — never color alone. */
      .cos-swatch{ display:block; width:28px; height:28px; box-shadow:inset 0 0 0 2px rgba(5,3,11,.65); }
      .cos-name{ font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:.3px; line-height:1.2; text-align:center; }
      /* The chip: EQUIPPED / the exact unlock condition / NEW. Reserved two lines. */
      .cos-chip{ font-family:var(--f-ui); font-size:var(--fs-2xs); letter-spacing:.5px; min-height:18px; color:var(--cream); text-align:center; line-height:1.3; }
      .cos-card.equipped .cos-chip{ color:var(--amber-hi); }
      /* Tiny corner spinner while the background write is in flight (stepped rotation —
         pixel-friendly; the card already reads EQUIPPED, success just clears this). */
      .cos-saving{ position:absolute; left:4px; bottom:4px; width:8px; height:8px;
        border:2px solid var(--dun-4); border-top-color:var(--cream);
        animation:cosSaving .7s steps(8) infinite; }
      @keyframes cosSaving{ to{ transform:rotate(360deg); } }
      /* The ONE inline message line (failure revert notice / locked-condition readout). */
      .closet-note{ min-height:14px; font-size:var(--fs-sm); margin:0; text-align:left; flex:0 0 14px; }
      /* The always-visible close affordance on the profile surfaces (48px touch target),
         pinned to the shell corner; same action as Back/Escape/B — just closes. */
      .panel-close{ position:absolute; top:8px; right:8px; z-index:2; min-width:48px; min-height:48px; width:48px; height:48px;
        padding:0; font-size:var(--fs-md); letter-spacing:0; }
      /* The closet OVERLAY (the title's CUSTOMIZE door): a panel ABOVE the title, never
         a mode swap — the translucent scrim keeps Play visibly anchored behind it, and
         closing returns to the untouched title with the blob repainted in place. */
      .closet-scrim{ position:fixed; inset:0; z-index:12; display:flex; align-items:center; justify-content:center;
        padding:16px; background:rgba(5,3,11,.5); }
      .closet-pop{ width:min(720px,94vw); max-height:min(560px,94vh); overflow:hidden auto; gap:10px; }
      .closet-pop .closet-pop-h{ padding-right:56px; }
      /* Mobile closet: PINNED preview stage, horizontal category rail, 2-col grid of
         >=64px cards — a tap equips instantly, so nothing needs to stay in reach. */
      @media (max-width:680px){
        .closet-panel{ height:auto; max-height:calc(100vh - 150px); overflow-y:auto; flex-direction:column; align-items:stretch; }
        .closet-stage{ position:sticky; top:0; z-index:2; flex-direction:row; justify-content:center; align-items:center;
          background:#0d0819; padding:6px 0; box-shadow:0 2px 0 var(--dun-3); }
        .closet-stage .blob-preview{ width:96px; height:96px; }
        .closet-right{ width:100%; }
        .closet-cats{ overflow-x:auto; flex:0 0 44px; }
        .closet-cat{ flex:0 0 auto; min-width:96px; min-height:44px; white-space:nowrap; }
        .closet-grid{ overflow-y:visible; min-height:0; }
        .cos-card{ width:calc(50% - 4px); min-width:64px; height:104px; }
      }
      /* Touch: full-leaderboard rows keep >=48px targets, category tabs >=44px, the
         72px-tall closet cards already clear the target comfortably, and the CUSTOMIZE
         chip grows to a full touch target. */
      @media (pointer:coarse){
        .lb-rows-full .lb-row{ height:48px; flex:0 0 48px; }
        .closet-cat{ min-height:44px; }
        .stage-customize{ min-height:44px; }
      }

      /* --- post-run sign-in nudge: renders WITH the screen, dismiss swaps in place --- */
      .nudge{ display:flex; flex-direction:column; gap:8px; align-items:center; min-height:88px; padding:10px 14px;
        background:#0d0819; box-shadow:inset 0 0 0 2px var(--dun-3); }
      .nudge-copy{ font-family:var(--f-ui); font-size:var(--fs-sm); letter-spacing:.3px; color:var(--cream); text-transform:none; line-height:1.5; margin:0; max-width:460px; }
      .nudge-row{ display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; }
      .nudge-row .btn-google{ width:auto; min-width:200px; }
      .nudge-later{ min-width:0; font-size:var(--fs-sm); padding:9px 14px; }
      .unlock-line{ color:var(--amber-hi); font-weight:700; letter-spacing:.5px; }

      @media (max-width:680px){
        .pp-top{ flex-direction:column; gap:12px; }
      }
      /* Touch-friendly rows on the FULL leaderboard screen for narrow/coarse-pointer
         devices (the title glance keeps its fixed 28px rows — its 154px reserve is exact). */
      @media (max-width:680px), (pointer:coarse){
        .lb-rows-full .lb-row{ height:48px; flex:0 0 48px; }
      }
      /* Narrow widths: collapse the less-important leaderboard columns (weapon/coins/time)
         so floor + kills stay readable without crowding — width-only (a wide touchscreen
         keeps the full set). Header + rows share the classes, so both collapse in step. */
      @media (max-width:680px){
        .lb-weapon, .lb-coins, .lb-time{ display:none; }
      }
      @media (max-width:440px){
        .lb-kills{ display:none; }
      }

      /* === WHAT'S NEW / CHANGELOG PANEL ===
         Reuses the .menu panel family + the global pixel scrollbar. A scrim-backed panel:
         a fixed header (WHAT'S NEW, or UPDATED · WHAT'S NEW for the returning-player popup)
         + close, a scrolling body of version sections (newest at top, 2px dun-3 dividers,
         Unreleased -> IN PROGRESS muted), entries as amber-bulleted rows (optional cream
         title + ink-mute body), and the [GOT IT] primary on the one-time popup. */
      .changelog-scrim{ position:fixed; inset:0; z-index:12; display:flex; align-items:center; justify-content:center;
        padding:16px; background:rgba(5,3,11,.55); }
      .changelog-pop{ width:min(560px,94vw); max-height:min(600px,92vh); padding:0; gap:0; overflow:hidden; }
      .cl-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px 12px;
        border-bottom:2px solid var(--dun-3); }
      .cl-title{ font-family:var(--f-logo); font-size:var(--fs-sm); letter-spacing:2px; color:var(--amber); line-height:1.4; }
      .cl-title .cl-flag{ color:var(--amber-hi); }
      /* The panel-close ✕ sits inline in the header here (not the absolute shell corner). */
      .changelog-pop .panel-close{ position:static; top:auto; right:auto; }
      .cl-body{ flex:1; min-height:0; overflow-y:auto; padding:2px 18px 8px; display:flex; flex-direction:column;
        text-align:left; scrollbar-gutter:stable; }
      .cl-section{ padding:12px 0; border-bottom:2px solid var(--dun-3); }
      .cl-section:last-child{ border-bottom:0; }
      .cl-date{ font-family:var(--f-ui); font-size:var(--fs-xs); letter-spacing:2px; color:var(--amber-hi);
        text-transform:uppercase; margin-bottom:8px; }
      .cl-date.progress{ color:var(--ink-mute); }
      .cl-entry{ display:flex; gap:8px; padding:4px 0; font-family:var(--f-ui); font-size:var(--fs-sm); line-height:1.5; }
      /* amber ▪ bullet leads every entry (grayscale-distinct geometry, not hue-only) */
      .cl-entry::before{ content:"\u25aa"; color:var(--amber); flex:0 0 auto; line-height:1.5; }
      .cl-entry-text{ min-width:0; }
      .cl-entry-title{ color:var(--cream); }
      .cl-entry-body{ color:var(--ink-mute); }
      .cl-foot{ display:flex; justify-content:center; padding:12px 18px 16px; border-top:2px solid var(--dun-3); }
      .cl-got-it{ min-width:180px; }

    </style>
  </head>
  <body>
    <div id="app"><canvas id="game"></canvas></div>
    <canvas id="minimap" width="176" height="132"></canvas>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
