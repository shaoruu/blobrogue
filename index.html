<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
    <title>blobrogue — a cowboy-blob roguelike</title>
    <style>
      /* CANONICAL :root tokens (ui designer, docs/ui/root_tokens.css) — all HUD CSS resolves against these. */
      :root{
        --dun-0:#05030b; --dun-1:#0e0b1a; --dun-2:#171227; --dun-3:#2a2140; --dun-4:#46356b;
        --amber:#ffb43b; --amber-hi:#ffd166; --amber-lo:#b06e12; --cream:#ffe9b0;
        --lea-0:#301c0e; --lea-1:#6b401e; --lea-2:#9c6633;
        --grn:#7fdd5a; --red:#ff5a5a; --bone:#e8e0c8; --blu:#5ab6ff; --pur:#b06bff;
        --ink:#120a24;
        --f-logo:'Press Start 2P',monospace;
        --f-ui:'Silkscreen','Press Start 2P',monospace;
        --f-num:'VT323',monospace;
        --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #0e0b1a; overflow: hidden; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
      #app { display: flex; align-items: center; justify-content: center; height: 100%; }
      canvas { image-rendering: pixelated; background: #14101f; touch-action: none; }

      /* --- HUD 4-corner layout (ui designer, docs/ui/hud_section_B_hud.css) --- */
      #hud{ position:fixed; inset:0; z-index:5; pointer-events:none; font-family:var(--f-num); }
      .hud-corner{ position:absolute; display:flex; flex-direction:column; gap:8px; }
      .hud-corner.tl{ top:16px; left:16px; }
      .hud-corner.tr{ top:16px; right:16px; align-items:flex-end; }
      .hud-corner.br{ bottom:16px; right:16px; align-items:flex-end; }
      .hud-corner.bl{ bottom:16px; left:16px; }
      .statpanel{ background:rgba(5,3,11,.62); box-shadow:inset 0 0 0 2px var(--dun-3),0 3px 0 rgba(0,0,0,.4); padding:9px 11px; display:flex; flex-direction:column; gap:7px; }
      .hearts{ display:flex; gap:3px; } .hearts canvas{ image-rendering:pixelated; }
      .statrow{ display:flex; gap:6px; align-items:center; }
      .chip{ display:inline-flex; align-items:center; gap:6px; background:var(--dun-1); box-shadow:inset 0 0 0 2px var(--dun-3); padding:3px 9px; }
      .chip .ic{ width:16px; height:16px; }
      .chip .v{ font-family:var(--f-num); font-size:19px; line-height:1; margin-top:2px; color:var(--cream); }
      .chip .k{ font-family:var(--f-ui); font-size:9px; letter-spacing:1px; color:var(--dun-4); text-transform:uppercase; }
      .chip.floor .v{ color:var(--amber); } .chip.coins .v{ color:var(--amber-hi); } .chip.kills .v{ color:#ff8a8a; }
      .coopstrip{ font-family:var(--f-ui); font-size:9px; letter-spacing:1px; color:var(--blu); background:rgba(5,3,11,.62); box-shadow:inset 0 0 0 2px var(--dun-3); padding:4px 9px; text-transform:uppercase; }
      .minimap{ width:132px; height:96px; background:var(--dun-0); position:relative; box-shadow:0 0 0 3px var(--ink),inset 0 0 0 2px var(--amber-lo),0 0 14px rgba(255,180,59,.12); }
      .minimap .mm-title{ position:absolute; top:-9px; left:8px; font-family:var(--f-ui); font-size:8px; letter-spacing:2px; color:var(--amber); background:var(--dun-0); padding:0 4px; z-index:1; }
      #minimap{ position:absolute; inset:3px; width:calc(100% - 6px); height:calc(100% - 6px); image-rendering:pixelated; display:block; }
      .weapon{ display:flex; align-items:center; gap:11px; background:rgba(5,3,11,.72); box-shadow:inset 0 0 0 2px var(--dun-3),0 3px 0 rgba(0,0,0,.4); padding:8px 13px; }
      .weapon .wname{ font-family:var(--f-ui); font-size:11px; color:var(--cream); letter-spacing:1px; }
      .weapon .wammo{ font-family:var(--f-num); font-size:20px; color:var(--amber-hi); margin-top:2px; }
      .dash{ display:flex; align-items:center; gap:8px; background:rgba(5,3,11,.72); box-shadow:inset 0 0 0 2px var(--dun-3); padding:6px 11px; }
      .dash .k{ font-family:var(--f-ui); font-size:9px; letter-spacing:1px; color:var(--dun-4); }
      .dash .bar{ width:70px; height:9px; background:var(--dun-0); box-shadow:inset 0 0 0 2px var(--dun-3); position:relative; }
      .dash .bar i{ position:absolute; top:2px; left:2px; bottom:2px; width:calc((100% - 4px) * var(--dash-fill,1)); background:var(--blu); box-shadow:0 0 6px var(--blu); transition:width .1s linear; }
      .dash.ready .bar i{ background:var(--grn); box-shadow:0 0 6px var(--grn); }

      #overlay, .pause-overlay, .blessing-overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; color: #ffe6b0; text-align: center;
        background: radial-gradient(ellipse at center, rgba(20,16,36,0.82) 0%, rgba(8,6,16,0.94) 100%); }
      /* subtle CRT scanlines over the overlay backing */
      #overlay::before, .pause-overlay::before, .blessing-overlay::before { content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
        background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 3px); opacity:0.5; }
      /* bordered pixel panel around menu content */
      .menu { position:relative; z-index:1; background:#120a24; padding:26px 30px;
        border:3px solid #05030b; box-shadow: inset 0 0 0 3px #2a2140, 0 8px 0 0 rgba(5,3,11,0.5); }
      .hidden { display: none !important; }

      .settings { display: flex; flex-direction: column; gap: 7px; align-items: center; margin-top: 2px; }
      .settings-shake { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #cbb6d6; }
      .settings-label { text-transform: uppercase; letter-spacing: 1px; color: #8579a0; }
      .settings-val { color: #ffd27a; font-variant-numeric: tabular-nums; }
      input[type="range"] { -webkit-appearance: none; appearance: none; width: 160px; height: 6px; padding: 0; border: none; border-radius: 4px; background: rgba(255,180,59,0.22); cursor: pointer; }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #ffb43b; cursor: pointer; }
      input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border: none; border-radius: 50%; background: #ffb43b; cursor: pointer; }

      .menu { display: flex; flex-direction: column; align-items: center; gap: 11px; padding: 20px 26px; max-width: 430px; width: 92vw; max-height: 94vh; }
      .logo-img { image-rendering: pixelated; width: min(340px, 70vw); height: auto; display:block; margin: 0 auto 2px; filter: drop-shadow(0 0 16px rgba(255,180,59,0.28)); }
      .menu h1 { font-family:'Press Start 2P', monospace; font-size: 30px; color: #ffb43b; letter-spacing: 2px; line-height:1.3; text-shadow: 0 4px 0 #05030b, 0 0 18px rgba(255,180,59,0.35); }
      .menu h1 .r { color:#ffe9b0; }
      .menu h1.died { color: #ff6a6a; text-shadow:0 4px 0 #05030b, 0 0 18px rgba(255,90,90,0.4); }
      .menu p { font-size: 12px; color: #cbb6d6; line-height: 1.45; margin: 0; }
      .menu p.muted { font-size: 12px; color: #8579a0; }
      .menu p.hint { font-size: 11px; color: #6f6689; margin-top: 4px; }

      .btnrow { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      /* --- UI kit: chunky diegetic arcade-dungeon buttons (ui designer spec) --- */
      button { --c:#ffb43b; --c-hi:#ffd166; --c-lo:#b06e12; --tx:#120a24;
        position:relative; display:inline-flex; align-items:center; justify-content:center; gap:9px;
        font-family:'Silkscreen',monospace; font-weight:700; font-size:15px; letter-spacing:1px; text-transform:uppercase;
        color:var(--tx); background:var(--c); cursor:pointer; border:0; padding:15px 28px; min-width:210px; line-height:1;
        clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
        box-shadow: inset 0 4px 0 0 var(--c-hi), inset 0 -5px 0 0 var(--c-lo), inset 0 0 0 3px #120a24, 0 6px 0 0 #05030b, 0 6px 0 3px #120a24;
        transition:transform .05s steps(2),box-shadow .05s steps(2),background .08s; text-shadow:0 2px 0 rgba(0,0,0,.28); }
      button:hover { --c:#ffd166; --c-hi:#ffe9b0; --c-lo:#ffb43b; transform:translateY(-2px);
        box-shadow:inset 0 4px 0 0 var(--c-hi),inset 0 -5px 0 0 var(--c-lo),inset 0 0 0 3px #120a24,0 8px 0 0 #05030b,0 8px 0 3px #120a24; }
      button:active { transform:translateY(6px);
        box-shadow:inset 0 4px 0 0 var(--c-hi),inset 0 -4px 0 0 var(--c-lo),inset 0 0 0 3px #120a24,0 0 0 0 #05030b,0 0 0 3px #120a24; }
      button:focus-visible { outline:3px solid #ffe9b0; outline-offset:5px; }
      button.secondary { --c:#2a2140; --c-hi:#46356b; --c-lo:#171227; --tx:#ffe9b0; text-shadow:0 2px 0 rgba(0,0,0,.5); }
      button.secondary:hover { --c:#46356b; --c-hi:#5a4788; --c-lo:#2a2140; --tx:#fff; }

      .namerow { display: flex; align-items: center; gap: 10px; }
      .namerow label { font-size: 12px; color: #8579a0; text-transform: uppercase; letter-spacing: 1px; }
      input { font-family:'Silkscreen',monospace; font-weight:700; font-size: 14px; letter-spacing:1px; padding: 11px 16px; background: #0d0819; color: #ffe6b0; border: 2px solid #05030b; box-shadow: inset 0 2px 0 #2a2140; text-align: center; outline:none; }
      input::placeholder { color:#6f6689; }
      input:focus { outline: none; border-color: #ffb43b; }
      .code-input { font-family:'Press Start 2P',monospace; font-size: 22px; letter-spacing: 10px; width: 220px; }

      .profile { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .profile:empty { display: none; }
      .profile-title { font-size: 12px; color: #ffb43b; letter-spacing: 1px; text-transform: uppercase; }
      .profile-grid { display: flex; gap: 18px; }
      .stat { display: flex; flex-direction: column; align-items: center; }
      .stat-value { font-size: 20px; color: #ffe6b0; font-variant-numeric: tabular-nums; }
      .stat-label { font-size: 11px; color: #8579a0; }

      .code-badge { font-size: 40px; letter-spacing: 10px; color: #ffb43b; background: #120e20; border: 1px solid rgba(255,180,59,0.4); border-radius: 12px; padding: 10px 22px; }
      .playerlist { display: flex; flex-direction: column; gap: 8px; min-width: 220px; }
      .playerrow { display: flex; align-items: center; gap: 10px; font-size: 14px; }
      .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

      /* --- Between-floor "choose a blessing" cards --- */
      .blessing { max-width: min(720px, 94vw); width: auto; }
      .blessing-cards { display: flex; gap: 14px; margin: 6px 0 2px; flex-wrap: wrap; justify-content: center; }
      .blessing-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px;
        width: 178px; min-width: 178px; min-height: 214px; padding: 18px 14px 16px; text-align: center; cursor: pointer;
        background: #0d0819; color: #ffe6b0; text-transform: none; letter-spacing: 0; font-family: var(--f-ui), monospace;
        border: 0; clip-path: none; box-shadow: inset 0 0 0 2px #05030b, inset 0 0 0 4px #2a2140, 0 5px 0 rgba(5,3,11,0.5);
        transition: transform .06s steps(2), box-shadow .06s steps(2); }
      .blessing-card:hover { transform: translateY(-2px); box-shadow: inset 0 0 0 2px #05030b, inset 0 0 0 4px var(--dun-4), 0 5px 0 rgba(5,3,11,0.5); }
      .blessing-card.selected, .blessing-card.selected:hover { box-shadow: inset 0 0 0 2px #05030b, inset 0 0 0 4px var(--amber), 0 5px 0 rgba(5,3,11,0.5), 0 0 16px rgba(255,180,59,0.35); }
      .blessing-card:focus-visible { outline: none; }
      .bc-key { position: absolute; top: 8px; left: 8px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
        font-family: var(--f-logo), monospace; font-size: 10px; color: var(--dun-0); background: var(--amber); }
      .bc-icon { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; margin-top: 6px; font-size: 30px; line-height: 1;
        background: color-mix(in srgb, var(--t) 22%, #0d0819); box-shadow: inset 0 0 0 2px var(--t), 0 0 12px color-mix(in srgb, var(--t) 45%, transparent); }
      .bc-name { font-family: var(--f-logo), monospace; font-size: 12px; color: var(--amber-hi); letter-spacing: 1px; line-height: 1.4; }
      .bc-rarity { font-size: 9px; letter-spacing: 2px; color: var(--dun-4); }
      .bc-rarity.uncommon { color: var(--blu); }
      .bc-rarity.rare { color: var(--pur); }
      .bc-desc { font-family: var(--f-num), monospace; font-size: 16px; line-height: 1.2; color: #cbb6d6; }

      /* --- HUD collected-blessing glyph strip (top-left, under the coop strip) --- */
      .itemstrip { display: none; flex-wrap: wrap; gap: 4px; max-width: 220px; }
      .itemchip { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; font-size: 13px; line-height: 1;
        background: rgba(5,3,11,.62); box-shadow: inset 0 0 0 2px var(--t, var(--dun-3)); }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="game"></canvas></div>
    <canvas id="minimap" width="176" height="132"></canvas>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
