<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
    <title>blobrogue — a cowboy-blob roguelike</title>
    <style>
      /* CANONICAL :root tokens (ui designer, docs/ui/root_tokens.css) — all HUD CSS resolves against these. */
      :root{
        --dun-0:#05030b; --dun-1:#0e0b1a; --dun-2:#171227; --dun-3:#2a2140; --dun-4:#46356b;
        --amber:#ffb43b; --amber-hi:#ffd166; --amber-lo:#b06e12; --cream:#ffe9b0;
        --lea-0:#301c0e; --lea-1:#6b401e; --lea-2:#9c6633;
        --grn:#7fdd5a; --red:#ff5a5a; --bone:#e8e0c8; --blu:#5ab6ff; --pur:#b06bff;
        --ink:#120a24;
        --f-logo:'Press Start 2P',monospace;
        --f-ui:'Silkscreen','Press Start 2P',monospace;
        --f-num:'VT323',monospace;
        --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #0e0b1a; overflow: hidden; font-family: 'Silkscreen', 'Press Start 2P', monospace; }
      #app { display: flex; align-items: center; justify-content: center; height: 100%; }
      canvas { image-rendering: pixelated; background: #14101f; touch-action: none; }
      /* The game canvas owns this exact viewport box from the FIRST paint (same formula the
         resize handler uses for the backing store), so the boot-time attribute resize can
         never shift the layout under the title menu. */
      #game { width: min(100vw, 2560px); height: min(100vh, 1440px); }

      /* === GLOBAL PIXEL SCROLLBAR ===
         ONE scrollbar for every scrollable surface (menu shell, closet grid, run-build
         strip, drawers, leaderboard — anything that overflows): thin, squared, token-
         colored, so the native OS chrome never breaks the dungeon look. Firefox via
         scrollbar-width/scrollbar-color; WebKit via the pseudo-element parts. No radius,
         no gradients — a flat dun thumb that warms to amber-lo under the pointer. */
      *{ scrollbar-width:thin; scrollbar-color:var(--dun-4) var(--dun-0); }
      ::-webkit-scrollbar{ width:10px; height:10px; }
      ::-webkit-scrollbar-track{ background:var(--dun-0); box-shadow:inset 0 0 0 1px var(--dun-1); }
      ::-webkit-scrollbar-thumb{ background:var(--dun-4); border:2px solid var(--dun-0); border-radius:0; }
      ::-webkit-scrollbar-thumb:hover{ background:var(--amber-lo); }
      ::-webkit-scrollbar-thumb:active{ background:var(--amber-lo); }
      ::-webkit-scrollbar-corner{ background:var(--dun-0); }
      /* Fixed panels reserve their scrollbar gutter up front, so content never shifts
         when an overflow appears mid-hydration (zero-CLS). */
      .menu, .closet-grid, .pc-build, .hb-drawer{ scrollbar-gutter:stable; }

      /* --- HUD 4-corner layout (ui designer, docs/ui/hud_section_B_hud.css) --- */
      /* --ui-scale is set from the persisted UI-scale setting (src/ui/settings.ts). */
      #hud{ position:fixed; inset:0; z-index:5; pointer-events:none; font-family:var(--f-num); zoom:var(--ui-scale,1); }
      .hud-corner{ position:absolute; display:flex; flex-direction:column; gap:8px; }
      .hud-corner.tl{ top:16px; left:16px; }
      .hud-corner.tr{ top:16px; right:16px; align-items:flex-end; }
      .hud-corner.br{ bottom:16px; right:16px; align-items:flex-end; }
      .hud-corner.bl{ bottom:16px; left:16px; }
      .statpanel{ background:rgba(5,3,11,.62); box-shadow:inset 0 0 0 2px var(--dun-3),0 3px 0 rgba(0,0,0,.4); padding:9px 11px; display:flex; flex-direction:column; gap:7px; }
      .hearts{ display:flex; gap:3px; } .hearts canvas{ image-rendering:pixelated; }
      .statrow{ display:flex; gap:6px; align-items:center; }
      .chip{ display:inline-flex; align-items:center; gap:6px; background:var(--dun-1); box-shadow:inset 0 0 0 2px var(--dun-3); padding:3px 9px; }
      .chip .ic{ width:16px; height:16px; }
      .chip .v{ font-family:var(--f-num); font-size:19px; line-height:1; margin-top:2px; color:var(--cream); }
      .chip .k{ font-family:var(--f-ui); font-size:9px; letter-spacing:1px; color:var(--dun-4); text-transform:uppercase; }
      .chip.floor .v{ color:var(--amber); } .chip.coins .v{ color:var(--amber-hi); } .chip.kills .v{ color:#ff8a8a; }
      .coopstrip{ font-family:var(--f-ui); font-size:9px; letter-spacing:1px; color:var(--blu); background:rgba(5,3,11,.62); box-shadow:inset 0 0 0 2px var(--dun-3); padding:4px 9px; text-transform:uppercase; }
      .minimap{ width:132px; height:96px; background:var(--dun-0); position:relative; box-shadow:0 0 0 3px var(--ink),inset 0 0 0 2px var(--amber-lo),0 0 14px rgba(255,180,59,.12); }
      .minimap .mm-title{ position:absolute; top:-9px; left:8px; font-family:var(--f-ui); font-size:8px; letter-spacing:2px; color:var(--amber); background:var(--dun-0); padding:0 4px; z-index:1; }
      #minimap{ position:absolute; inset:3px; width:calc(100% - 6px); height:calc(100% - 6px); image-rendering:pixelated; display:block; }
      /* --- bottom-center hotbar (Minecraft-style): one slot per owned weapon --- */
      .hotbar{ position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
        display:flex; flex-direction:column; align-items:center; gap:7px; max-width:min(94vw,940px); }
      /* The slots row is pointer-enabled: click equips, drag reorders. Everything outside
         the slots/chips stays pointer-transparent so gameplay aim/fire is never blocked. */
      .hb-slots{ position:relative; display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-end; gap:6px; pointer-events:auto; }
      /* UI Director gate: the EQUIPPED slot is the dominant one — unequipped slots are the
         compact base size, the lit slot grows and lifts. */
      .hb-slot{ position:relative; width:66px; min-width:48px; min-height:48px; padding:9px 4px 7px;
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
        background:rgba(5,3,11,.72); box-shadow:inset 0 0 0 2px var(--dun-3),0 3px 0 rgba(0,0,0,.4);
        transition:transform .06s steps(2),box-shadow .06s steps(2),width .06s steps(2);
        cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none; }
      .hb-slot:hover{ box-shadow:inset 0 0 0 2px var(--dun-4),0 3px 0 rgba(0,0,0,.4); }
      /* focus = EXTERNAL dashed ring (distinct grayscale geometry — never a glow) */
      .hb-slot:focus-visible{ outline:2px dashed var(--amber-hi); outline-offset:3px; }
      .hb-slot .hb-icon, .hb-slot .hb-icon img{ width:30px; height:30px; }
      /* equipped = lift + DOUBLE frame + top notch (geometry-first, grayscale-distinct;
         the old amber glow was nonsemantic ornament and is gone — combat outranks UI) */
      .hb-slot.on{ width:84px; background:var(--dun-2); transform:translateY(-4px);
        box-shadow:inset 0 0 0 2px var(--amber),inset 0 0 0 4px var(--dun-0),0 3px 0 rgba(0,0,0,.4); }
      .hb-slot.on::after{ content:""; position:absolute; top:-6px; left:50%; transform:translateX(-50%);
        width:10px; height:4px; background:var(--amber); box-shadow:0 0 0 1px var(--dun-0); }
      .hb-slot.on .hb-icon, .hb-slot.on .hb-icon img{ width:40px; height:40px; }
      /* THE weapon-card tooltip: one root-level floating element (never a slot child, so
         no hotbar/drawer clipping and no per-slot duplicates), position:fixed and
         pointer-events:none, populated + anchored ~10px above the hovered/focused slot by
         Hud.showTipFor with 12px viewport clamps. Carries the HUD zoom so it scales with
         the bar; z 7 sits above the hotbar chrome and below scrim(8)/drawer(9)/menus(10). */
      .hb-tip{ position:fixed; left:0; top:0; z-index:7; display:none; pointer-events:none; zoom:var(--ui-scale,1);
        flex-direction:column; gap:3px; text-align:left; width:max-content; max-width:266px; overflow-wrap:anywhere;
        font-family:var(--f-num); font-size:14px; line-height:1.15; color:var(--bone); background:var(--dun-1);
        box-shadow:0 0 0 2px var(--ink),0 4px 0 rgba(0,0,0,.5); padding:6px 9px; }
      .hb-tip.show{ display:flex; }
      /* header = the strongest element on the card; everything below steps down. */
      .hb-tip .th{ display:flex; align-items:center; gap:6px; padding-bottom:3px; border-bottom:1px solid var(--dun-3); }
      .hb-tip .ti{ flex:none; width:20px; height:20px; display:flex; align-items:center; justify-content:center;
        background:var(--dun-0); box-shadow:inset 0 0 0 1px var(--dun-3); }
      .hb-tip .ti img{ width:16px; height:16px; image-rendering:pixelated; }
      .hb-tip .ti .glyphfb{ font-family:var(--f-num); font-size:12px; line-height:1; color:var(--cream); }
      .hb-tip .tn{ font-family:var(--f-ui); font-size:9px; letter-spacing:1px; color:var(--amber); }
      .hb-tip .tj{ font-family:var(--f-ui); font-size:7px; letter-spacing:2px; color:var(--amber-hi); margin-bottom:2px; }
      .hb-tip .tr{ display:flex; align-items:baseline; gap:7px; }
      .hb-tip .tk{ font-family:var(--f-ui); font-size:7px; letter-spacing:1px; color:var(--dun-4); min-width:52px; }
      .hb-tip .tv{ color:var(--cream); }
      /* comparison tokens read by GLYPH + WORD first; the tint is the last channel. */
      .hb-tip .td{ font-family:var(--f-ui); font-size:6px; letter-spacing:1px; align-self:center; }
      .hb-tip .td.up{ color:var(--grn); } .hb-tip .td.down{ color:var(--red); } .hb-tip .td.eq{ color:#9a8fb5; }
      /* technique/tradeoff block sits behind a structural keyline, not a color wash. */
      .hb-tip .tm{ color:var(--blu); border-left:2px solid var(--dun-4); padding-left:6px; }
      .hb-tip .tm.gains{ color:var(--grn); } .hb-tip .tm.loses{ color:var(--red); } .hb-tip .tm.changes{ color:var(--amber); }
      .hb-tip .tx{ font-family:var(--f-ui); font-size:7px; letter-spacing:1px; color:var(--amber); }
      /* drag/drop feedback (grayscale-distinct geometry, zero layout shift):
         - source slot: dimmed + diagonal hatch (never just a tint)
         - ghost: OPAQUE card, hard offset shadow, a MOVE tag — no glow, no equipped notch
         - insertion target: 4px bar with triangle caps — the FIRST-priority cue mid-drag.
         The ghost positions purely via its inline translate3d (transition:none so it never
         lags the pointer; origin 0 0 so the zoom-compensating scale() keeps its top-left
         at the exact pointer-minus-grab-offset point). */
      .hb-slot.dragging{ opacity:.35;
        background-image:repeating-linear-gradient(45deg, rgba(232,224,200,.28) 0 2px, transparent 2px 7px); }
      .hb-ghost{ position:fixed; left:0; top:0; z-index:9; margin:0; pointer-events:none;
        transition:none; transform-origin:0 0;
        background:var(--dun-2); box-shadow:inset 0 0 0 2px var(--amber-hi),0 5px 0 rgba(0,0,0,.55); }
      .hb-ghost::after{ display:none; } /* no equipped notch on the preview */
      .hb-ghost .hb-move{ position:absolute; top:-8px; left:50%; transform:translateX(-50%); padding:1px 4px;
        font-family:var(--f-ui); font-size:6px; letter-spacing:1px; line-height:1;
        color:var(--dun-0); background:var(--amber-hi); box-shadow:0 0 0 1px var(--ink); }
      .hb-ins{ position:absolute; width:4px; background:var(--amber-hi); box-shadow:0 0 0 1px var(--ink); pointer-events:none; z-index:7; }
      .hb-ins::before, .hb-ins::after{ content:""; position:absolute; left:50%; transform:translateX(-50%);
        border-left:5px solid transparent; border-right:5px solid transparent; }
      .hb-ins::before{ top:-5px; border-top:5px solid var(--amber-hi); }
      .hb-ins::after{ bottom:-5px; border-bottom:5px solid var(--amber-hi); }
      /* empty capacity boxes: the bar is always MAX_OWNED_WEAPONS slots wide, so the cap
         reads at a glance and a pickup fills a box instead of shifting the layout. Inert
         (no pointer events) and visually recessive next to real slots. */
      .hb-empty{ position:relative; width:66px; min-width:48px; min-height:48px; padding:9px 4px 7px; align-self:stretch;
        background:rgba(5,3,11,.42); box-shadow:inset 0 0 0 2px rgba(58,48,80,.6); pointer-events:none; }
      .hb-empty .hb-key{ opacity:.4; }
      /* the full-hotbar swap prompt: anchored ABOVE the bar (absolute — zero layout
         shift), pointer-enabled buttons only. Amber frame = an actionable state, not
         passive chrome. */
      .hb-swap{ position:absolute; bottom:calc(100% + 12px); left:50%; transform:translateX(-50%); z-index:7;
        display:none; flex-direction:column; align-items:center; gap:8px; padding:9px 12px 8px; pointer-events:auto;
        background:var(--dun-1); box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--amber),0 6px 0 rgba(0,0,0,.5); }
      .hb-swap.show{ display:flex; }
      .hs-head{ display:flex; align-items:center; gap:8px; font-family:var(--f-ui); font-size:9px; letter-spacing:1px; color:var(--cream); white-space:nowrap; }
      .hs-tag{ padding:2px 5px; background:var(--amber); color:var(--dun-0); }
      .hs-icon, .hs-icon img{ width:22px; height:22px; image-rendering:pixelated; }
      .hs-name{ color:var(--amber-hi); }
      .hs-row{ display:flex; align-items:center; gap:6px; }
      /* compact prompt buttons: opt OUT of the chunky menu button kit (min-width/clip-
         path/lift), these are hotbar-scaled chrome. */
      .hs-slot{ position:relative; width:44px; min-width:44px; height:44px; padding:0; border:0; cursor:pointer;
        display:inline-flex; align-items:center; justify-content:center;
        clip-path:none; text-shadow:none; transition:none;
        background:rgba(5,3,11,.72); box-shadow:inset 0 0 0 2px var(--dun-3),0 2px 0 rgba(0,0,0,.4); }
      .hs-slot:hover, .hs-slot:active{ transform:none; background:var(--dun-2);
        box-shadow:inset 0 0 0 2px var(--amber-hi),0 2px 0 rgba(0,0,0,.4); }
      .hs-slot:focus-visible{ outline:2px dashed var(--amber-hi); outline-offset:2px; }
      .hs-slot img{ width:24px; height:24px; image-rendering:pixelated; }
      .hs-key{ position:absolute; top:2px; left:2px; min-width:12px; height:12px; display:flex; align-items:center; justify-content:center;
        font-family:var(--f-ui); font-size:7px; color:var(--cream); background:var(--dun-0); box-shadow:inset 0 0 0 1px var(--dun-3); }
      .hs-leave{ margin-left:4px; padding:0 10px; min-width:0; height:44px; border:0; cursor:pointer;
        clip-path:none; text-shadow:none; transition:none; white-space:nowrap;
        font-family:var(--f-ui); font-size:8px; letter-spacing:1px; color:var(--cream);
        background:rgba(5,3,11,.72); box-shadow:inset 0 0 0 2px var(--dun-3),0 2px 0 rgba(0,0,0,.4); }
      .hs-leave:hover, .hs-leave:active{ transform:none; background:var(--dun-2);
        box-shadow:inset 0 0 0 2px var(--dun-4),0 2px 0 rgba(0,0,0,.4); }
      .hs-leave:focus-visible{ outline:2px dashed var(--amber-hi); outline-offset:2px; }
      .hs-hint{ font-family:var(--f-ui); font-size:7px; letter-spacing:1px; color:var(--dun-4); }
      /* interaction hint, absolutely anchored under the strip (never shifts the hotbar). */
      .hb-hint{ position:absolute; top:calc(100% + 2px); left:50%; transform:translateX(-50%); white-space:nowrap;
        font-family:var(--f-ui); font-size:8px; letter-spacing:1px; color:var(--dun-4); pointer-events:none;
        text-shadow:0 1px 0 var(--dun-0); opacity:0; transition:opacity .3s ease; }
      .hb-hint.show{ opacity:1; }
      /* BUILD·N pill: the compact/touch summary of the blessing row. Hidden on desktop
         (the chip strip shows instead); compact contexts swap them (media query below). */
      .hb-build{ display:none; pointer-events:auto; min-height:48px; min-width:48px; padding:0 16px; align-items:center; justify-content:center;
        font-family:var(--f-ui); font-size:9px; letter-spacing:1px; color:var(--cream); border:0; cursor:pointer;
        background:rgba(5,3,11,.72); box-shadow:inset 0 0 0 2px var(--dun-3),0 3px 0 rgba(0,0,0,.4); }
      .hb-build:focus-visible{ outline:2px solid var(--amber-hi); outline-offset:2px; }
      /* UI Part4: narrow viewports drop the weapon-name labels but keep icons + key badges
         (48px minimum tap targets hold); the blessing chips collapse into the BUILD·N pill
         there AND on any coarse-pointer device (hover tooltips are unreachable on touch). */
      @media (max-width:700px){
        .hb-name{ display:none; }
        .hb-slot{ width:48px; }
        .hb-slot.on{ width:60px; }
        .hb-empty{ width:48px; }
      }
      @media (max-width:700px), (pointer:coarse){
        .hb-buffs.show{ display:none; }
        .hb-build.has{ display:inline-flex; }
      }
      /* bottom drawers (full build / weapon stats): fixed overlays above the HUD with a
         click-to-close scrim that swallows every pointer event — gameplay never sees a tap
         while a drawer is open. Transform/visibility only: zero layout shift. */
      .hb-scrim{ position:fixed; inset:0; z-index:8; display:none; background:rgba(5,3,11,.55); pointer-events:auto; }
      .hb-scrim.show{ display:block; }
      .hb-drawer{ position:fixed; left:50%; bottom:0; z-index:9; width:min(94vw,460px); max-height:60vh; overflow-y:auto; pointer-events:auto;
        display:flex; flex-direction:column; gap:10px; padding:12px 14px 16px;
        background:var(--dun-1); box-shadow:0 0 0 3px var(--ink),inset 0 0 0 2px var(--dun-3),0 -6px 18px rgba(0,0,0,.5);
        transform:translate(-50%,105%); visibility:hidden; transition:transform .12s steps(3), visibility 0s .12s; }
      .hb-drawer.open{ transform:translate(-50%,0); visibility:visible; transition:transform .12s steps(3); }
      .hd-head{ display:flex; justify-content:space-between; align-items:center; gap:12px;
        font-family:var(--f-ui); font-size:10px; letter-spacing:2px; color:var(--amber); }
      .hd-close{ min-width:64px; min-height:36px; border:0; cursor:pointer; font-family:var(--f-ui); font-size:8px; letter-spacing:1px;
        color:var(--cream); background:var(--dun-2); box-shadow:inset 0 0 0 1px var(--dun-4); }
      .hd-close:focus-visible{ outline:2px solid var(--amber-hi); }
      .hd-body{ display:flex; flex-direction:column; gap:9px; font-family:var(--f-num); font-size:15px; color:var(--bone); }
      .hd-row{ display:flex; gap:9px; align-items:flex-start; }
      .hd-icon{ flex:none; width:24px; height:24px; display:flex; align-items:center; justify-content:center;
        background:rgba(5,3,11,.72); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--t,var(--dun-4)) 75%, var(--dun-3)); }
      .hd-icon img{ width:14px; height:14px; image-rendering:pixelated; }
      .hd-icon .glyphfb{ font-family:var(--f-num); font-size:13px; line-height:1; color:var(--t,var(--cream)); }
      .hd-text{ display:flex; flex-direction:column; gap:2px; }
      .hd-name{ font-family:var(--f-ui); font-size:8px; letter-spacing:1px; color:var(--t,var(--amber-hi)); }
      .hd-desc{ line-height:1.15; color:var(--cream); }
      .hd-next{ line-height:1.15; color:#9a8fb5; }
      .hd-stats{ display:flex; gap:8px; }
      .hd-stat{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 4px;
        background:rgba(5,3,11,.6); box-shadow:inset 0 0 0 1px var(--dun-3); }
      .hd-stat span{ font-family:var(--f-ui); font-size:7px; letter-spacing:1px; color:var(--dun-4); }
      .hd-stat b{ font-family:var(--f-num); font-size:18px; font-weight:400; color:var(--amber-hi); }
      .hd-role{ margin:0; font-family:var(--f-ui); font-size:8px; letter-spacing:2px; color:var(--amber-hi); }
      .hd-special{ margin:0; font-family:var(--f-num); font-size:14px; line-height:1.2; color:var(--blu); }
      .hd-drop{ min-height:48px; border:0; cursor:pointer; font-family:var(--f-ui); font-size:9px; letter-spacing:2px;
        color:var(--red); background:rgba(255,90,90,.08); box-shadow:inset 0 0 0 2px #5a2030; }
      /* danger reads as TRIANGLE + TEXT before any tint (grayscale/color-blind safe). */
      .hd-drop::before{ content:""; display:inline-block; margin-right:8px; vertical-align:-1px;
        border-left:5px solid transparent; border-right:5px solid transparent; border-bottom:8px solid var(--red); }
      .hd-drop:focus-visible{ outline:2px solid var(--red); }
      .hb-key{ position:absolute; top:3px; left:3px; min-width:14px; height:14px; display:flex; align-items:center; justify-content:center;
        font-family:var(--f-logo); font-size:8px; line-height:1; color:var(--dun-4); background:var(--dun-0); box-shadow:inset 0 0 0 1px var(--dun-3); }
      .hb-slot.on .hb-key{ color:var(--dun-0); background:var(--amber); box-shadow:inset 0 0 0 1px var(--amber-hi); }
      .hb-icon{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; filter:drop-shadow(0 2px 0 rgba(0,0,0,.45)); }
      .hb-icon img{ width:40px; height:40px; image-rendering:pixelated; }
      .hb-name{ font-family:var(--f-ui); font-size:8px; letter-spacing:.5px; line-height:1; color:var(--bone); opacity:.8; max-width:100%; overflow:hidden; white-space:nowrap; }
      .hb-slot.on .hb-name{ color:var(--amber-hi); opacity:1; }
      /* blessing slots on the row above the weapon slots (UI Director gate): max 8 compact
         24px icon-only squares — tint border + a small LV badge — plus a "+N" overflow chip;
         the hold-Tab panel lists the full build. Full name, exact current effect, and the
         next-level delta live in the hover/focus tooltip. */
      .hb-buffs{ display:none; flex-wrap:wrap; justify-content:center; gap:4px; pointer-events:auto; }
      .hb-buffs.show{ display:flex; }
      .hb-buff{ position:relative; width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center;
        background:rgba(5,3,11,.72); cursor:help;

        flex-direction:column; gap:3px; text-align:left; width:max-content; max-width:250px;
        font-family:var(--f-num); font-size:14px; line-height:1.15; color:var(--bone); background:var(--dun-1);
        box-shadow:0 0 0 2px var(--ink),inset 0 0 0 1px var(--dun-4); padding:6px 9px; }
      .hb-buff:hover .tip, .hb-buff:focus-visible .tip{ display:flex; }
      .hb-buff .tip .tn{ font-family:var(--f-ui); font-size:8px; letter-spacing:1px; color:var(--t,var(--amber)); }
      .hb-buff .tip .tc{ color:var(--cream); }
      .hb-buff .tip .tx{ color:#9a8fb5; }
      .hb-buff .tip .tx.max{ color:var(--amber); }
      .dash{ display:flex; align-items:center; gap:8px; background:rgba(5,3,11,.72); box-shadow:inset 0 0 0 2px var(--dun-3); padding:6px 11px; }
      .dash .k{ font-family:var(--f-ui); font-size:9px; letter-spacing:1px; color:var(--dun-4); }
      .dash .bar{ width:70px; height:9px; background:var(--dun-0); box-shadow:inset 0 0 0 2px var(--dun-3); position:relative; }
      .dash .key{ font-family:var(--f-ui); font-size:8px; letter-spacing:1px; color:var(--cream); background:var(--dun-0); box-shadow:inset 0 0 0 1px var(--dun-3); padding:2px 4px; }
      .dash .bar i{ position:absolute; top:2px; left:2px; bottom:2px; width:calc((100% - 4px) * var(--dash-fill,1)); background:var(--blu); box-shadow:0 0 6px var(--blu); transition:width .1s linear; }
      .dash.ready{ box-shadow:inset 0 0 0 2px var(--grn); }

      .dash.ready .bar i{ background:var(--grn); box-shadow:0 0 8px var(--grn); }
      /* Contextual action prompt (bottom-left, under the dash): the revive/interact
         affordance. Same chrome family as the dash; a fixed min-height + opacity toggle so
         appearing never shifts the corner. `.active` = the hold is channeling right now. */
      .ctx-prompt{ display:flex; align-items:center; gap:8px; background:rgba(5,3,11,.72);
        box-shadow:inset 0 0 0 2px var(--dun-3); padding:6px 11px; min-height:29px;
        opacity:0; transition:opacity .2s ease; }
      .ctx-prompt.show{ opacity:1; }
      .ctx-prompt .key{ font-family:var(--f-ui); font-size:8px; letter-spacing:1px; color:var(--cream);
        background:var(--dun-0); box-shadow:inset 0 0 0 1px var(--dun-3); padding:2px 4px; }
      .ctx-prompt .k{ font-family:var(--f-ui); font-size:9px; letter-spacing:1px; color:var(--grn); text-transform:uppercase; }
      .ctx-prompt.active{ box-shadow:inset 0 0 0 2px var(--grn); }
      .ctx-prompt.active .key{ color:var(--grn); box-shadow:inset 0 0 0 1px var(--grn); }
      /* --- responsive HUD under 700px (UI Part4): the objective lane keeps its hierarchy
         (boss bar wins, combo yields harder), and the revive/interact prompt stays READABLE
         — same type size, bounded width with an ellipsis instead of shrinking or wrapping
         into the hotbar. --- */
      @media (max-width:700px){
        .objlane{ width:min(420px,58vw); gap:4px; }
        .objective{ font-size:9px; letter-spacing:2px; }
        .waitline{ font-size:8px; letter-spacing:1px; max-width:92vw; }
        .bossbar-track{ height:12px; }
        .combo.show{ transform:translateY(0) scale(.85); }
        .objlane.boss .combo.show{ transform:translateY(0) scale(.6); }
        .ctx-prompt .k{ max-width:44vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .minimap{ width:104px; height:78px; }
      }
      /* --- the ONE top-center objective lane (UI Director hierarchy) ---
         A single vertical stack owns the top-center: the boss bar OR the normal objective
         line (never both — boss wins), the co-op coordination line, then the combo. Every
         occupant toggles via opacity/transform only, and the combo sits LAST in the stack,
         so its show/hide can never shift a line above it. */
      .objlane{ position:absolute; top:14px; left:50%; transform:translateX(-50%); width:min(560px,60vw);
        display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; }
      .objective{ min-height:14px; font-family:var(--f-ui); font-size:10px; letter-spacing:3px; text-transform:uppercase;
        color:var(--cream); text-shadow:0 2px 0 var(--dun-0),0 0 10px rgba(0,0,0,.6);
        opacity:0; transition:opacity .3s ease; }
      .objective.show{ opacity:1; }
      .objective.clear{ color:var(--grn); text-shadow:0 2px 0 var(--dun-0),0 0 12px rgba(138,255,192,.35); }
      .waitline{ min-height:12px; font-family:var(--f-ui); font-size:9px; letter-spacing:2px; text-transform:uppercase;
        color:var(--cream); text-shadow:0 2px 0 var(--dun-0),0 0 10px rgba(0,0,0,.6); text-align:center;
        opacity:0; transition:opacity .3s ease; }
      .waitline.show{ opacity:1; }
      /* boss health bar: the lane's first slot while a boss is on the board (the normal
         objective line hides for it). */
      .bossbar{ width:100%; display:flex; flex-direction:column; align-items:center; gap:4px; pointer-events:none;
        transform:translateY(-10px); opacity:0; transition:opacity .3s ease, transform .3s ease; }
      .bossbar.show{ opacity:1; transform:translateY(0); }
      .bossbar:not(.show){ display:none; } /* free the lane's slot (the objective line replaces it) */
      .bossbar-label{ font-family:var(--f-ui); font-size:10px; letter-spacing:4px; color:#ff8a8a;
        text-shadow:0 2px 0 var(--dun-0),0 0 10px rgba(255,80,80,0.5);
        /* Authored boss names replace the generic label: always ONE line inside the lane's
           fixed width — a too-long name clips to an ellipsis, never wraps or shifts. */
        text-transform:uppercase; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .bossbar-track{ width:100%; height:16px; background:var(--dun-0); box-shadow:inset 0 0 0 2px #5a2030, 0 0 12px rgba(255,60,60,0.35); position:relative; overflow:hidden; }
      .bossbar-track i{ position:absolute; inset:0; transform-origin:left center; transform:scaleX(1);
        background:linear-gradient(180deg,#ff5a5f 0%,#c81e2e 100%); box-shadow:0 0 10px rgba(255,60,60,0.6);
        transition:transform .18s ease; }
      .bossbar.low .bossbar-track i{ animation:bossLow .4s steps(2,jump-none) infinite; }
      @keyframes bossLow{ 0%{opacity:1;} 100%{opacity:.45;} }
      /* kill-chain combo: the lane's LAST slot. Opacity/transform only; hidden at combo 0.
         While the boss bar owns the lane the combo yields the spotlight at 70% scale. */
      .combo{ transform:translateY(-8px) scale(.9); transform-origin:top center;
        display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; pointer-events:none;
        opacity:0; transition:opacity .18s ease, transform .18s ease; }
      .combo.show{ opacity:1; transform:translateY(0) scale(1); }
      .objlane.boss .combo.show{ transform:translateY(0) scale(.7); }
      /* Badge: the AD's stamped-plate white mask, tinted per-tier via mask-image (the DOM
         equivalent of the fxTinted trick — alpha carries the rim+fill, color fills it). */
      .combo-badge{ position:relative; width:120px; height:60px; display:flex; align-items:center; justify-content:center; }
      .combo-badge::before{ content:""; position:absolute; inset:0;
        -webkit-mask:url("/sprites/hud/combo_badge.png") center/contain no-repeat; mask:url("/sprites/hud/combo_badge.png") center/contain no-repeat;
        background:var(--combo-c,var(--cream)); filter:drop-shadow(0 0 10px color-mix(in srgb, var(--combo-c,var(--amber)) 45%, transparent)); }
      .combo-mult{ position:relative; font-family:var(--f-num); font-size:34px; line-height:.85; color:#fff; transform-origin:center;
        text-shadow:0 2px 0 var(--dun-0),0 0 10px color-mix(in srgb, var(--combo-c,var(--amber)) 60%, transparent); }
      /* One-shot tier-up flare: the burst mask, tinted, scaling 0.5->1.4 and fading over ~0.3s. */
      .combo-burst{ position:absolute; left:50%; top:50%; width:128px; height:128px; transform:translate(-50%,-50%) scale(.5); opacity:0;
        -webkit-mask:url("/sprites/hud/combo_burst.png") center/contain no-repeat; mask:url("/sprites/hud/combo_burst.png") center/contain no-repeat;
        background:var(--combo-c,var(--amber)); pointer-events:none; }
      .combo-burst.fire{ animation:comboBurst .32s ease-out 1; }
      @keyframes comboBurst{ 0%{opacity:.9; transform:translate(-50%,-50%) scale(.5);} 100%{opacity:0; transform:translate(-50%,-50%) scale(1.4);} }
      .combo-row{ display:flex; align-items:baseline; gap:5px; }
      .combo-n{ font-family:var(--f-num); font-size:19px; line-height:1; color:var(--cream); }
      .combo-k{ font-family:var(--f-ui); font-size:8px; letter-spacing:2px; color:#8b90a8; }
      /* Window bar: AD's frame mask (static, tinted) with the fill mask scaled to remaining %. */
      .combo-bar{ position:relative; width:120px; height:12px; }
      .combo-bar::before{ content:""; position:absolute; inset:0;
        -webkit-mask:url("/sprites/hud/combo_meter_frame.png") center/100% 100% no-repeat; mask:url("/sprites/hud/combo_meter_frame.png") center/100% 100% no-repeat;
        background:var(--combo-c,var(--amber)); opacity:.85; }
      .combo-bar i{ position:absolute; inset:0; transform-origin:left center; transform:scaleX(var(--combo-fill,1));
        -webkit-mask:url("/sprites/hud/combo_meter_fill.png") left/100% 100% no-repeat; mask:url("/sprites/hud/combo_meter_fill.png") left/100% 100% no-repeat;
        background:var(--combo-c,var(--amber)); box-shadow:0 0 6px var(--combo-c,var(--amber)); transition:transform .08s linear; }
      .combo.low .combo-bar i{ animation:comboLow .38s steps(2,jump-none) infinite; }
      @keyframes comboLow{ 0%{opacity:1;} 100%{opacity:.3;} }

      #overlay, .pause-overlay, .blessing-overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; color: #ffe6b0; text-align: center;
        background: radial-gradient(ellipse at center, rgba(20,16,36,0.82) 0%, rgba(8,6,16,0.94) 100%); zoom:var(--ui-scale,1); }

        background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 3px); opacity:0.5; }
      /* bordered pixel panel around menu content */

      /* The input is 24px tall (the touch hit area = the thumb); the visible 6px track is
         drawn by the track pseudo-elements so the look is unchanged. */
      input[type="range"] { -webkit-appearance: none; appearance: none; width: 160px; height: 24px; padding: 0; border: none; background: transparent; cursor: pointer; }
      input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 4px; background: rgba(255,180,59,0.22); }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; margin-top: -9px; border-radius: 50%; background: #ffb43b; cursor: pointer; }
      input[type="range"]::-moz-range-track { height: 6px; border-radius: 4px; background: rgba(255,180,59,0.22); }
      input[type="range"]::-moz-range-thumb { width: 24px; height: 24px; border: none; border-radius: 50%; background: #ffb43b; cursor: pointer; }
      input[type="range"]:focus-visible { outline: 3px solid #ffe9b0; outline-offset: 3px; }

      .btnrow { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      /* --- UI kit: chunky diegetic arcade-dungeon buttons (ui designer spec) --- */

        clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
        box-shadow: inset 0 4px 0 0 var(--c-hi), inset 0 -5px 0 0 var(--c-lo), inset 0 0 0 3px #120a24, 0 6px 0 0 #05030b, 0 6px 0 3px #120a24;
        transition:transform .05s steps(2),box-shadow .05s steps(2),background .08s; text-shadow:0 2px 0 rgba(0,0,0,.28); }

      .blessing-card:focus-visible { outline: 3px solid #ffe9b0; outline-offset: 3px; }
      .bc-key { position: absolute; top: 8px; left: 8px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
        font-family: var(--f-logo), monospace; font-size: 10px; color: var(--dun-0); background: var(--amber); }
      .bc-icon { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; margin-top: 6px; font-size: 30px; line-height: 1;
        background: color-mix(in srgb, var(--t) 22%, #0d0819); box-shadow: inset 0 0 0 2px var(--t), 0 0 12px color-mix(in srgb, var(--t) 45%, transparent); }
      .bc-icon img { width: 48px; height: 48px; image-rendering: pixelated; }
      .bc-icon .glyphfb { font-size: 30px; line-height: 1; color: var(--cream); }
      .bc-name { font-family: var(--f-logo), monospace; font-size: 12px; color: var(--amber-hi); letter-spacing: 1px; line-height: 1.4; }
      .bc-tag { font-family: var(--f-ui), monospace; font-size: 8px; letter-spacing: 2px; padding: 2px 6px; }
      .bc-tag.new { color: var(--grn); box-shadow: inset 0 0 0 1px var(--grn); }
      .bc-tag.up { color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
      .bc-rarity { font-size: 9px; letter-spacing: 2px; color: var(--dun-4); }
      .bc-rarity.uncommon { color: var(--blu); }
      .bc-rarity.rare { color: var(--pur); }
      .bc-desc { font-family: var(--f-num), monospace; font-size: 16px; line-height: 1.2; color: #cbb6d6; }

      /* --- Patch's shop panel: the compact interact panel (world keeps rendering behind it).
         Anchored above the hotbar so it never covers the buyer or the pedestal row; the
         action row is the ONE purchase control, and its disabled states carry the exact
         copy matrix (NEED N MORE COINS / SOLD / OWNED / MAX LV / FULL HEALTH). The two
         non-buy groups must never look alike (incl. grayscale + color-blind): .broke is
         the LIVE amber-OUTLINE + coin glyph ("for sale, fund it"), .resolved is the muted
         flat + check ("settled for you"). --- */
      .shop-panel { position: fixed; left: 50%; bottom: 118px; transform: translateX(-50%); z-index: 9; }
      .shop-panel.hidden { display: none; }
      .shop-card { width: 302px; background: #0d0819; color: #ffe6b0; padding: 12px 14px; text-align: left;
        box-shadow: inset 0 0 0 2px #05030b, inset 0 0 0 4px #2a2140, 0 5px 0 rgba(5,3,11,0.5); font-family: var(--f-ui), monospace; }
      .shop-head { display: flex; gap: 10px; align-items: center; }
      .shop-coins { margin: 0 0 8px; font-size: 9px; letter-spacing: 1.5px; color: var(--amber-hi); text-align: right; }
      .shop-icon { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: none; font-size: 22px; line-height: 1;
        color: var(--cream); background: color-mix(in srgb, var(--t, #ffb43b) 22%, #0d0819); box-shadow: inset 0 0 0 2px var(--t, #2a2140); }
      .shop-icon img { width: 36px; height: 36px; image-rendering: pixelated; }
      .shop-icon .glyphfb { font-size: 22px; line-height: 1; color: var(--cream); }
      .shop-title h1 { font-family: var(--f-logo), monospace; font-size: 12px; margin: 0 0 4px; color: var(--amber-hi); letter-spacing: 1px; }
      .shop-meta { margin: 0; font-size: 9px; letter-spacing: 1.5px; color: var(--dun-4); display: flex; gap: 8px; align-items: center; }
      .shop-tag { color: var(--grn); box-shadow: inset 0 0 0 1px var(--grn); padding: 1px 5px; }
      .shop-tag.hidden { display: none; }
      .shop-ownership { margin: 8px 0 0; font-size: 9px; letter-spacing: 1.5px; color: var(--grn); }
      .shop-ownership.shared { color: var(--amber); }
      .shop-lines { margin: 6px 0 10px; }
      .shop-lines p { margin: 2px 0; font-family: var(--f-num), monospace; font-size: 15px; line-height: 1.25; color: #cbb6d6; }
      .shop-buy { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; padding: 9px 10px; border: 0; cursor: pointer; font-family: var(--f-logo), monospace;
        font-size: 11px; letter-spacing: 1px; color: var(--dun-0); background: var(--amber);
        box-shadow: inset 0 0 0 2px #05030b, 0 3px 0 rgba(5,3,11,0.5); }
      .shop-buy:hover:not(:disabled) { background: var(--amber-hi); }
      .shop-buy:focus-visible { outline: 3px solid #ffe9b0; outline-offset: 2px; }
      .shop-buy:disabled { cursor: default; }
      .shop-buy .shop-buy-glyph { display: inline-flex; align-items: center; line-height: 1; }
      /* unaffordable = still for sale: amber OUTLINE (never filled, never the resolved grey) */
      .shop-buy.broke { background: #0d0819; color: var(--amber);
        box-shadow: inset 0 0 0 2px var(--amber), 0 3px 0 rgba(5,3,11,0.5); }
      /* settled for this viewer (sold/owned/max/full/spent): muted flat + check */
      .shop-buy.resolved { background: #241a38; color: #9a8fb5;
        box-shadow: inset 0 0 0 2px #05030b, 0 3px 0 rgba(5,3,11,0.5); }
      .shop-foot { margin: 8px 0 0; font-size: 8px; letter-spacing: 1px; color: #cbb6d6; text-align: center; min-height: 10px; }
      .shop-foot.bought { color: var(--grn); }
      .shop-card .hint { margin: 6px 0 0; font-size: 8px; letter-spacing: 1.5px; color: var(--dun-4); text-align: center; }

      /* === MENU SHELL (fixed-geometry launchpad) — overrides earlier menu rules ===
         The home shell renders SYNCHRONOUSLY before any auth/network work, so every box
         below carries explicit dimensions: the desktop shell is min(820px,94vw), the hero/
         body/foot own fixed heights, and hydration only ever swaps content INSIDE them. */
      .menu{ position:relative; z-index:1; background:#120a24; border:3px solid #05030b; box-shadow:inset 0 0 0 3px #2a2140,0 8px 0 rgba(5,3,11,.5);
        padding:22px 26px 20px; width:min(840px,94vw); max-width:none; max-height:calc(100vh - 40px); overflow:hidden auto;
        display:flex; flex-direction:column; gap:16px; align-items:stretch; }
      /* CANONICAL HOME GEOMETRY (the accepted placement): the shell is a grid of a
         RAISED 150px hero row + minmax(0,1fr) body at height min(548px,100vh-40px),
         min-height 508px. Only the hero row grew — the body boxes are UNCHANGED from
         the shipped launchpad: left rows 82/54/16/154 (PLAY ONLINE / PLAY SOLO /
         status / glance), right 112px identity card + two stacked 82px destinations —
         so every zero-CLS box below the hero stays identical. Desktop budget closes
         exactly: 548 - 48 chrome = 500 = 150 hero + 14 row gap + 336 body
         (= 82+54+16+154 + 3 x 10 column gaps). */
      .menu-home{ display:grid; grid-template-rows:150px minmax(0,1fr); gap:14px;
        height:min(548px,calc(100vh - 40px)); min-height:508px; }
      /* --- THE HERO BLOB STAGE (identity showpiece) ---
         Two-column hero band: the wordmark left, the 132x132 .blob-stage right. The
         stage holds a 96px canvas rendered by the shared CosmeticLoadout renderer with
         the calm idle (canvas-side blink/wave, capped) over a quiet radial plinth glow
         and a soft ground-shadow ellipse — the blob STANDS, it never floats. Deliberate
         non-chrome: NO button affordance, NO amber fill, NO arrow, no CSS animation —
         PLAY ONLINE below stays the only amber-filled element and the first action.
         Every bound here is fixed from first paint, so cosmetics/loading never shift
         anything. */
      /* Explicit row AND column: the CUSTOMIZE chip shares this grid cell (grid-placed
         over the band), and auto-placement must never push the hero into an implicit
         second column. */
      .home-hero{ grid-row:1; grid-column:1; display:grid; grid-template-columns:1fr 132px; gap:16px; align-items:center;
        min-height:0; overflow:hidden; padding-bottom:10px; border-bottom:2px solid var(--dun-3); }
      .hero-mark{ display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center; min-width:0; }
      /* Fixed logo box (intrinsic 1128x192; the img element also carries width/height
         attributes so the space is reserved before the file streams in). */
      .logo-img{ image-rendering:pixelated; height:40px; width:235px; max-width:100%; object-fit:contain; display:block; margin:0; filter:drop-shadow(0 0 16px rgba(255,180,59,.28)); }
      .home-hero .tag{ font-family:var(--f-ui); font-size:10px; line-height:1.4; letter-spacing:.5px; color:var(--dun-4); max-width:640px; min-height:28px; text-transform:none; margin:0; }
      .home-hero .blob-stage{ position:relative; flex:none; width:132px; height:132px;
        background:transparent; box-shadow:none; display:flex; align-items:center; justify-content:center; }
      /* the radial plinth glow (quiet, low alpha — never competes with the amber Play) */
      .home-hero .blob-stage::before{ content:""; position:absolute; inset:6px; border-radius:50%;
        background:radial-gradient(closest-side, rgba(255,180,59,.16), rgba(255,180,59,.05) 55%, transparent 74%); }
      /* the soft ground-shadow ellipse under the feet — standing, not floating */
      .home-hero .blob-stage::after{ content:""; position:absolute; left:50%; bottom:15px; width:60px; height:10px;
        transform:translateX(-50%); border-radius:50%; background:rgba(5,3,11,.55); }
      .home-hero .blob-stage .blob-preview{ position:relative; z-index:1; width:96px; height:96px;
        image-rendering:pixelated; background:transparent; }
      /* The small closet door beside the blob — the natural place to tap your guy. Quiet
         secondary chrome. DOM-LAST (PLAY keeps first tab/reading order) but grid-placed
         INTO the hero row, anchored at the blob's feet — no absolute offsets, so the
         responsive hero variants keep it beside the blob for free. */
      .stage-customize{ grid-row:1; grid-column:1; justify-self:end; align-self:end; margin:0 140px 12px 0;
        z-index:2; min-width:0; width:auto; font-size:8px; letter-spacing:1px; padding:8px 10px; white-space:nowrap; }
      .body{ display:flex; gap:20px; align-items:stretch; }
      .home-body{ display:grid; grid-template-columns:1.22fr 0.78fr; gap:20px; flex:1; min-height:0; }
      .col-actions{ flex:1.15; display:flex; flex-direction:column; gap:11px; min-width:0; }
      /* Exact left rows: 82 online / 54 solo / 16 status / 154 glance (+ 3 x 10px gaps
         = 336, the body row under the 150px hero). */
      .home-left{ display:flex; flex-direction:column; gap:10px; min-width:0; }
      .home-left .btn-quick{ height:82px; flex:0 0 82px; padding:0 22px; }
      .home-left .play-solo{ height:54px; flex:0 0 54px; padding:0 22px; }
      .home-left .lb-preview{ margin-top:0; }
      .home-right{ flex:1; display:flex; flex-direction:column; gap:10px; min-width:0; border-left:2px solid var(--dun-3); padding-left:20px; }
      .col-h{ font-family:var(--f-ui); font-size:9px; letter-spacing:2px; color:var(--dun-4); text-transform:uppercase; text-align:left; }
      .btn-quick{ width:100%; flex-direction:column; gap:5px; padding:17px 22px; font-size:17px; min-width:0; }
      .btn-quick .sub{ font-family:var(--f-ui); font-weight:400; font-size:9px; letter-spacing:.3px; text-transform:none; opacity:.85; text-shadow:none; }
      .col-actions .play-solo{ width:100%; font-size:16px; padding:15px 22px; min-width:0; }
      .actrow{ display:flex; gap:10px; } .actrow button{ flex:1; min-width:0; }
      .namerow{ display:flex; flex-direction:column; gap:5px; align-items:stretch; text-align:left; }
      .namerow label{ font-family:var(--f-ui); font-size:9px; letter-spacing:2px; color:var(--dun-4); text-transform:uppercase; }
      .menu input[type=text]{ font-family:var(--f-num); font-size:20px; letter-spacing:1px; padding:8px 12px; background:#0d0819; color:var(--cream); border:0; box-shadow:inset 0 0 0 2px var(--dun-3),inset 0 3px 6px rgba(0,0,0,.5); text-align:left; outline:none; width:100%; }
      .menu input::placeholder{ color:var(--dun-4); }
      /* --- Blob-color pick (right column identity) --- */
      .swatches{ display:flex; gap:7px; }
      .swatch{ flex:0 0 auto; width:26px; height:26px; min-width:0; padding:0; border:0; cursor:pointer; box-shadow:inset 0 0 0 2px rgba(5,3,11,.65); }
      .swatch:hover{ transform:translateY(-1px); box-shadow:inset 0 0 0 2px rgba(5,3,11,.65); }
      .swatch:active{ transform:translateY(1px); box-shadow:inset 0 0 0 2px rgba(5,3,11,.65); }
      .swatch.sel, .swatch.sel:hover{ box-shadow:inset 0 0 0 2px #05030b, inset 0 0 0 4px var(--cream); }
      /* --- Optional Google sign-in (right column identity) --- */
      
      .authrow{ display:flex; flex-direction:column; gap:5px; align-items:stretch; }
      .btn-google{ display:flex; align-items:center; justify-content:center; gap:9px; width:100%; font-size:11px; padding:9px 12px; min-width:0; text-transform:none; letter-spacing:1px; }
      .btn-google svg{ display:block; flex:0 0 auto; }
      .auth-status{ font-size:10px; color:var(--red); text-align:left; min-height:12px; margin:0; }
      .auth-status:empty{ display:none; }
      .account{ display:flex; align-items:center; gap:10px; background:#0d0819; box-shadow:inset 0 0 0 2px var(--dun-3); padding:8px 10px; }
      .account-av{ flex:0 0 auto; width:32px; height:32px; background:var(--dun-3); box-shadow:inset 0 0 0 2px var(--dun-4); image-rendering:auto; object-fit:cover; }
      .account-av.has-img{ background:transparent; }
      .account-info{ display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; text-align:left; }
      .account-name{ font-family:var(--f-ui); font-size:12px; color:var(--cream); letter-spacing:.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .account-sub{ font-family:var(--f-ui); font-size:8px; letter-spacing:1px; color:var(--dun-4); text-transform:uppercase; }
      .account-out{ flex:0 0 auto; font-size:9px; padding:6px 9px; min-width:0; text-transform:uppercase; }
      .profile{ display:flex; flex-direction:column; gap:8px; align-items:stretch; }
      .profile:empty{ display:none; }
      .profile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
      .stat{ background:#0d0819; box-shadow:inset 0 0 0 2px var(--dun-3); padding:6px 9px; display:flex; flex-direction:column; gap:1px; align-items:flex-start; }
      .stat-value{ font-family:var(--f-num); font-size:21px; color:var(--cream); line-height:1; }
      .stat-value.amber{ color:var(--amber); }
      .stat-label{ font-family:var(--f-ui); font-size:8px; letter-spacing:1px; color:var(--dun-4); text-transform:uppercase; }
      .settings{ display:flex; flex-direction:column; gap:7px; align-items:stretch; margin:0; }
      .settings button{ font-size:11px; padding:9px 12px; min-width:0; justify-content:space-between; width:100%; text-transform:uppercase; }
      /* min-height 44px = comfortable touch row (label line + 24px thumb) */
      .settings-shake{ display:flex; flex-direction:column; justify-content:center; gap:5px; min-height:44px; font-family:var(--f-ui); font-size:9px; color:var(--dun-4); text-transform:uppercase; letter-spacing:1px; }
      .settings-shake .lab{ display:flex; justify-content:space-between; } .settings-val{ color:var(--amber); }
      /* square pixel-kit track inside the menu shell (overrides the rounded base track) */
      .menu input[type=range]{ width:100%; }
      .menu input[type=range]::-webkit-slider-runnable-track{ border-radius:0; }
      .menu input[type=range]::-moz-range-track{ border-radius:0; }
      .foot{ font-family:var(--f-ui); font-size:9px; letter-spacing:.5px; color:var(--dun-4); text-align:center; text-transform:none; min-height:20px; padding-top:6px; border-top:2px solid var(--dun-3); margin:0; }
      /* FINAL RESPONSIVE CONTRACT — <=680px width: ONE column with FIXED mobile rows
         (identity stays 176, destinations stay 90); the glance stays exactly 3 rows at a
         fixed 142px (5 pad + 18 head + 4 gap + 88 rows + 4 gap + 18 state + 5 pad). */
      @media (max-width:680px){
        .menu-home{ height:auto; min-height:0; grid-template-rows:auto auto; }
        .body{ flex-direction:column; }
        .home-body{ grid-template-columns:1fr; }
        /* Narrow: the hero STACKS (accepted responsive spec) — centered wordmark above a
           104px stage (80px blob), PLAY immediately below and still the first action
           above the fold. */
        .home-hero{ grid-template-columns:1fr; justify-items:center; gap:8px; }
        .home-hero .blob-stage{ width:104px; height:104px; }
        .home-hero .blob-stage .blob-preview{ width:80px; height:80px; }
        .home-hero .blob-stage::after{ bottom:11px; width:50px; height:9px; }
        .stage-customize{ justify-self:center; margin:0 0 12px 122px; }
        .home-right{ border-left:0; border-top:2px solid var(--dun-3); padding-left:0; padding-top:14px; }
        /* .home-left carries the specificity so the later base .lb-preview rule can't
           override this media block (source order vs cascade). */
        .home-left .lb-preview{ height:142px; padding:5px 10px; gap:4px; }
        .home-right .identity-card{ height:108px; flex:0 0 108px; }
        .home-right .home-dest{ height:66px; flex:0 0 66px; }
      }
      /* Short viewports (accepted responsive spec): a compact 100px hero row with an
         88px stage (64px blob) so PLAY + the leaderboard preview stay visible without
         scrolling Play off-screen; the shell follows content and never hides the glance. */
      @media (max-height:679px){
        .menu-home{ height:auto; min-height:0; grid-template-rows:100px minmax(0,1fr); }
        .home-hero{ grid-template-columns:1fr 88px; }
        .home-hero .blob-stage{ width:88px; height:88px; }
        .home-hero .blob-stage .blob-preview{ width:64px; height:64px; }
        .home-hero .blob-stage::after{ bottom:10px; width:36px; height:7px; }
        .stage-customize{ margin:0 98px 8px 0; }
      }

      /* === TITLE HIERARCHY + DESTINATIONS (menu/identity redesign) ===
         Attention order is explicit: (1) the amber PLAY actions, (2) the identity card +
         top-runs preview in quiet panel chrome, (3) the destination row and footline.
         Every async region (auth, stats, leaderboard) OWNS its final geometry from first
         paint — skeletons fill in place, so hydration causes no layout shift and no
         click-target movement. */
      /* Skeletons are QUIET: a static muted block, no animation anywhere on the shell. */
      .skel{ position:relative; color:transparent !important; background:var(--dun-2); box-shadow:inset 0 0 0 1px var(--dun-3); min-width:64px; opacity:.7; }

      /* --- the top-runs GLANCE (left column, under PLAY) — the accepted FIXED shape ---
         Total panel height is EXACTLY 154px, composed top to bottom:
           9 pad + 18 head + 6 gap + (3 rows x 28 + 2 x 2 row-gap = 88) + 6 gap + 18 state + 9 pad
         Dark, quiet, no animation, no amber fill — only the #1 rank numeral wears amber.
         Every box exists from first paint; hydration replaces contents only. */
      .lb-preview{ display:flex; flex-direction:column; gap:6px; margin-top:7px; height:154px; padding:9px 10px;
        box-shadow:inset 0 0 0 1px var(--dun-3); }
      .lb-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; height:18px; flex:0 0 18px; }
      .lb-head .col-h{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      /* The view action is an explicit but link-quiet affordance, not a chunky button. */
      .lb-view{ min-width:0; width:auto; font-size:8px; padding:4px 6px; letter-spacing:1px;
        background:transparent; color:#8f87a8; clip-path:none; box-shadow:none; text-shadow:none; }
      .lb-view:hover{ transform:none; background:transparent; color:var(--cream); box-shadow:inset 0 -1px 0 var(--dun-4); }
      .lb-view:active{ transform:none; box-shadow:none; }
      .lb-view:focus-visible{ outline:2px solid var(--amber-hi); outline-offset:1px; }
      .lb-rows{ display:flex; flex-direction:column; gap:2px; }
      .lb-row{ display:flex; align-items:center; gap:8px; width:100%; min-width:0; height:28px; flex:0 0 28px; padding:0 8px;
        font-family:var(--f-ui); font-size:10px; letter-spacing:.5px; text-transform:none; text-align:left;
        color:#cbb6d6; background:transparent; clip-path:none;
        box-shadow:inset 0 0 0 1px var(--dun-2); text-shadow:none; transition:none; }
      .lb-row:hover:not(:disabled){ background:var(--dun-1); transform:none; box-shadow:inset 0 0 0 1px var(--dun-4); color:var(--cream); }
      .lb-row:active:not(:disabled){ transform:none; box-shadow:inset 0 0 0 1px var(--dun-4); }
      .lb-row:disabled{ cursor:default; }
      .lb-row:focus-visible{ outline:2px solid var(--amber-hi); outline-offset:1px; }
      .lb-rank{ flex:0 0 16px; font-family:var(--f-num); font-size:15px; color:var(--dun-4); text-align:right; }
      /* The one permitted warm accent in the glance: the #1 numeral. */
      .lb-rows .lb-row:nth-child(1) .lb-rank{ color:var(--amber); }
      .lb-dot{ flex:0 0 9px; width:9px; height:9px; background:var(--dun-3); }
      .lb-name{ flex:1; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; min-height:12px; }
      .lb-floor{ flex:0 0 auto; font-family:var(--f-num); font-size:15px; color:#9a8fb5; min-width:48px; text-align:right; }
      /* The ONE fixed 18px state line: board-level states (offline/empty) outrank the
         player's own out-of-rows rank readout; single line, ellipsized, never wraps. */
      .menu p.lb-standing{ height:18px; flex:0 0 18px; font-family:var(--f-ui); font-size:9px; letter-spacing:.3px;
        color:#8f87a8; text-transform:none; line-height:18px; margin:0; text-align:left;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      /* The full LEADERBOARD destination keeps the readable panel treatment + its own
         two-line reserved note (`.menu p` specificity so p.muted sizing can't overflow it). */
      .menu p.lb-note{ min-height:30px; font-size:10px; line-height:1.5; margin:0; text-align:left; }
      .lb-rows-full .lb-row{ height:38px; flex:0 0 38px; background:var(--dun-1); box-shadow:inset 0 0 0 1px var(--dun-3); color:var(--cream); }
      .lb-rows-full .lb-floor{ color:var(--amber-hi); }


      /* --- reserved identity card (right column): guest CTA and account chip share ONE
         geometry so signed-in/out/loading/error never move anything below --- */
      /* FINAL identity-card geometry: 112px desktop / 108px mobile, one reserved box for
         guest / busy / error / signed-in — content swaps only. Right grid = 112/82/82 with
         10px gaps. Junior to Play by construction: dark chrome, no amber fill/pulse/glow. */
      /* The login card: one 42px+1fr, three-track grid for every state — the fixed 40px
         bright icon patch (Google mark / avatar), title + value, then the full-width
         action strip + note. Dark chrome, secondary purple CTA, no amber/glow/animation;
         focus rings are EXTERNAL (the global button outline). */
      .identity-card{ display:grid; grid-template-columns:42px 1fr; grid-template-rows:auto auto 1fr; gap:4px 8px;
        height:112px; flex:0 0 112px; overflow:hidden;
        padding:9px 10px; background:#0d0819; box-shadow:inset 0 0 0 2px var(--dun-3); }
      /* The guest frame reads stronger than an ordinary panel — still dark, never warm. */
      .identity-card.guest{ box-shadow:inset 0 0 0 2px var(--dun-4); }
      .id-patch{ grid-column:1; grid-row:1 / span 2; width:40px; height:40px; background:#f4f2ec;
        display:flex; align-items:center; justify-content:center; box-shadow:inset 0 0 0 2px #05030b; }
      .id-patch svg{ display:block; width:22px; height:22px; }
      .id-avatar{ display:block; width:40px; height:40px; object-fit:cover; image-rendering:auto; }
      .id-title{ grid-column:2; grid-row:1; font-family:var(--f-ui); font-size:10px; letter-spacing:1px; color:var(--cream); text-transform:uppercase; text-align:left;
        height:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .menu p.id-value{ grid-column:2; grid-row:2; font-family:var(--f-ui); font-size:9px; letter-spacing:.2px; color:#8f87a8; text-transform:none; line-height:12px; margin:0; text-align:left; height:24px; overflow:hidden; }
      .id-actions{ grid-column:1 / -1; grid-row:3; align-self:end; display:flex; flex-direction:column; gap:4px; min-width:0; }
      .id-view{ min-width:0; width:100%; font-size:9px; padding:0 8px; height:28px; letter-spacing:1px; }
      .menu p.id-note{ font-family:var(--f-ui); font-size:8px; letter-spacing:.2px; color:var(--dun-4); text-transform:none; line-height:12px; height:12px; flex:0 0 12px; margin:0; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      /* Mid-OAuth placeholder: the identity card's "signing you in" state, centered in the
         same reserved box the chip/CTA occupy — it settles in place when the exchange ends. */
      .menu p.id-pending{ margin:auto; text-align:center; color:var(--cream); white-space:normal; height:auto; flex:1; }
      /* The CTA is a SECONDARY (dark) control — never an amber/warm fill, no animation. */
      .btn-google{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; font-size:9px; padding:0 10px; min-width:0; height:28px; flex:0 0 28px; letter-spacing:1px; }
      .auth-status{ font-size:10px; color:var(--red); text-align:left; min-height:12px; margin:0; }
      /* Reserved status/failure line on action screens (online home, join code): busy,
         error, and retry copy swap INSIDE this box — the buttons around it never move. */
      .status-line{ min-height:36px; margin:0; display:flex; align-items:center; justify-content:center; gap:12px; }
      /* Compact TRY AGAIN inside the reserved status line (retryable invite failure only):
         sized to fit the 36px box, so its presence never moves the buttons around it. */
      .status-line .status-retry{ font-size:9px; letter-spacing:1px; padding:6px 12px; min-height:0; }

      .you-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; text-align:left; }
      .you-name{ font-family:var(--f-ui); font-size:11px; color:var(--cream); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .you-stats{ font-family:var(--f-ui); font-size:9px; color:#8f87a8; min-height:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      /* The fixed home status line: reserved from first paint (boot/exit notes swap
         content inside it; single line, ellipsized). */
      .menu p.home-status{ height:16px; flex:0 0 16px; font-family:var(--f-ui); font-size:9px; letter-spacing:.3px;
        color:#8f87a8; text-transform:none; line-height:16px; margin:0; text-align:left;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      /* The two 82px home destinations, stacked (10px grid gaps). */
      .navrow{ display:flex; flex-direction:column; gap:10px; }
      .home-dest{ height:82px; flex:0 0 82px; min-width:0; width:100%; flex-direction:column; gap:6px; justify-content:center;
        font-size:12px; letter-spacing:1px; padding:0 16px; }
      .home-dest .dest-sub{ font-family:var(--f-ui); font-weight:400; font-size:8px; letter-spacing:.3px; text-transform:none; opacity:.8; text-shadow:none; }

      /* --- profile screens (the shared fixed card + the own wardrobe) --- */
      /* Worn title under the name: reserved line, so titled and untitled render at the
         same height and equipping a title never shifts the screen. */
      .worn-title{ min-height:15px; font-family:var(--f-ui); font-size:11px; letter-spacing:1px; color:var(--amber-hi); text-transform:none; margin:0; }
      /* THE PROFILE CARD: one fixed ~640x430 surface for every profile (own Overview and
         the read-only player view). Attention order: appearance/name (left) -> ranked top
         run + exact build (right, top) -> lifetime (right, bottom). Every region is
         reserved; loading/private/no-snapshot swap content inside identical boxes. */
      .pc-context{ text-align:center; }
      .profile-card{ width:min(640px,100%); height:430px; margin:0 auto; display:flex; gap:20px; padding:16px;
        background:#0d0819; box-shadow:inset 0 0 0 2px var(--dun-3); text-align:left; }
      .pc-left{ flex:0 0 192px; display:flex; flex-direction:column; gap:7px; min-width:0; }
      .blob-stage{ flex:0 0 192px; width:192px; height:192px; background:var(--dun-0);
        box-shadow:inset 0 0 0 2px var(--dun-3); display:flex; align-items:center; justify-content:center; }
      .blob-stage .blob-preview{ width:192px; height:192px; image-rendering:pixelated; }
      .pc-name{ font-family:var(--f-ui); font-size:13px; letter-spacing:1px; color:var(--cream);
        min-height:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .pc-rank{ min-height:14px; font-family:var(--f-ui); font-size:9px; letter-spacing:.3px; color:#8f87a8;
        text-transform:none; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      /* Owner-only slot (name editor + CUSTOMIZE BLOB); reserved on read-only profiles
         too, so both variants share byte-identical card geometry. */
      .pc-left-slot{ min-height:40px; display:flex; flex-direction:column; gap:8px; justify-content:flex-end; }
      .pc-customize{ width:100%; min-width:0; font-size:9px; padding:10px 8px; letter-spacing:1px; }
      /* The editable blob name (own Overview): guests edit + SAVE anytime through the
         same sanitized login path; signed-in goes read-only (the server names accounts
         from Google). Fixed rows — 12 label / 30 field / 12 note — inside the card. */
      .pc-nameedit{ width:100%; display:flex; flex-direction:column; gap:4px; }
      .pc-nameedit > .col-h{ height:12px; }
      .pc-namerow{ display:flex; gap:6px; }
      .menu input[type=text].pc-nameinput{ flex:1 1 0; min-width:0; width:auto; height:30px; font-size:16px; padding:4px 8px; }
      .pc-nameinput:disabled{ color:#9a8fb5; }
      .pc-name-save{ flex:0 0 auto; min-width:52px; height:30px; font-size:9px; padding:0 10px; letter-spacing:1px; }
      .menu p.pc-name-note{ font-family:var(--f-ui); font-size:8px; letter-spacing:.2px; color:var(--dun-4); text-transform:none;
        line-height:12px; height:12px; margin:0; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .pc-right{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
      .pc-run{ grid-template-columns:1fr 1fr 1fr 1fr; }
      .pc-run .stat-value{ font-size:18px; }
      .pc-build{ height:64px; overflow-y:auto; align-content:flex-start; justify-content:flex-start; }
      .pc-lifetime{ min-height:56px; }
      .pc-life{ grid-template-columns:1fr 1fr 1fr 1fr; }
      .pc-life .stat-value{ font-size:16px; }
      .pc-life-note{ margin:0; font-size:11px; text-align:left; }
      .pc-account{ display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; min-height:52px; }
      .pc-signin{ width:auto; min-width:220px; }
      .pc-tabs{ display:flex; gap:8px; justify-content:center; }
      .pc-tab{ min-width:120px; font-size:9px; padding:9px 12px; letter-spacing:1px; }
      .pc-tab.on{ box-shadow:inset 0 0 0 2px var(--amber), 0 0 0 0 transparent; color:var(--amber-hi); }
      .lb-arrow{ flex:0 0 auto; font-family:var(--f-num); font-size:15px; color:var(--dun-4); }
      .lb-row:hover:not(:disabled) .lb-arrow, .lb-row:focus-visible .lb-arrow{ color:var(--cream); }
      @media (max-width:680px){
        .profile-card{ height:auto; flex-direction:column; align-items:center; }
        .pc-left{ align-items:center; text-align:center; }
      }
      .pp-top{ display:flex; gap:18px; align-items:center; justify-content:center; }
      .pp-top .blob-preview{ flex:0 0 96px; width:96px; height:96px; image-rendering:pixelated;
        background:#0d0819; box-shadow:inset 0 0 0 2px var(--dun-3); }
      .pp-top .profile-grid{ flex:0 1 320px; }
      .build-strip{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; min-height:24px; }
      .build-chip{ font-family:var(--f-ui); font-size:9px; letter-spacing:.5px; color:var(--cream); padding:5px 8px;
        background:#0d0819; box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--t,var(--dun-4)) 75%, var(--dun-3)); }
      .build-chip.weapon{ color:var(--amber-hi); box-shadow:inset 0 0 0 1px var(--amber-lo); }
      /* --- THE CLOSET: a fixed panel (stage | categories + grid + inline message line).
         INSTANT EQUIP — no action strip, no save step, nothing to discard. Card states
         (.cos-card owned|equipped|locked) are carried by GEOMETRY + GLYPH + TEXT, never
         hue alone: equipped lifts 3px with the amber DOUBLE frame, the persistent .cos-
         check badge and the EQUIPPED chip; locked wears the hatch overlay, the .cos-lock
         glyph, a desaturated thumb and its exact condition as the chip (still focusable
         so the condition is readable); NEW wears the one-visit chip; the in-flight write
         rides a tiny .cos-saving corner spinner. */
      .closet-panel{ display:flex; gap:16px; width:min(640px,100%); height:430px; margin:0 auto; padding:14px;
        background:#0d0819; box-shadow:inset 0 0 0 2px var(--dun-3); text-align:left; }
      .closet-stage{ flex:0 0 128px; display:flex; flex-direction:column; gap:6px; align-items:center; }
      .closet-stage .blob-preview{ width:128px; height:128px; image-rendering:pixelated;
        background:var(--dun-0); box-shadow:inset 0 0 0 2px var(--dun-3); }
      .closet-right{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
      .closet-cats{ display:flex; gap:6px; flex:0 0 30px; }
      .closet-cat{ flex:1; min-width:0; font-size:8px; padding:8px 4px; letter-spacing:1px; }
      .closet-cat.on{ box-shadow:inset 0 0 0 2px var(--cream); color:var(--cream); }
      .closet-grid{ flex:1; min-height:0; display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start; overflow-y:auto; }
      .cos-card{ position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; width:96px; min-width:72px; height:104px; padding:10px 4px 6px;
        text-transform:none; letter-spacing:0; clip-path:none; text-shadow:none; cursor:pointer;
        background:var(--dun-1); color:var(--cream); box-shadow:inset 0 0 0 2px var(--dun-3); transition:none; }
      .cos-card.owned:hover{ transform:none; background:var(--dun-2); box-shadow:inset 0 0 0 2px var(--dun-4); }
      .cos-card:active{ transform:none; }
      /* equipped: 3px lift + amber DOUBLE frame + the .cos-check badge (geometry first —
         the lift/frame/badge/chip survive grayscale and every color-vision deficiency). */
      .cos-card.equipped, .cos-card.equipped:hover{ transform:translateY(-3px); background:var(--dun-2);
        box-shadow:inset 0 0 0 2px var(--amber), inset 0 0 0 4px var(--dun-0); }
      .cos-check{ position:absolute; top:3px; right:3px; width:14px; height:14px; display:flex; align-items:center; justify-content:center;
        font-family:var(--f-num); font-size:12px; line-height:1; color:var(--dun-0); background:var(--amber); box-shadow:0 0 0 1px var(--ink); }
      /* locked: hatch overlay + lock glyph + desaturated thumb; NOT equippable but still
         focusable, so the condition chip is readable by keyboard/pad/screen reader. */
      .cos-card.locked{ cursor:default; color:#9a8fb5; }
      /* Hover must NOT warm a locked card (the global button:hover would win otherwise —
         locked cards are enabled so their condition stays focusable/readable). */
      .cos-card.locked:hover{ transform:none; background:var(--dun-1); box-shadow:inset 0 0 0 2px var(--dun-3); }
      .cos-card.locked::after{ content:""; position:absolute; inset:0; pointer-events:none;
        background-image:repeating-linear-gradient(45deg, rgba(5,3,11,.4) 0 2px, transparent 2px 7px); }
      .cos-card.locked .cos-icon{ filter:grayscale(1) brightness(.7); }
      /* CSS-drawn padlock (font-independent): body square + shackle. */
      .cos-lock{ position:absolute; top:8px; right:5px; width:10px; height:7px; background:#9a8fb5; }
      .cos-lock::before{ content:""; position:absolute; top:-5px; left:2px; width:2px; height:3px;
        border:2px solid #9a8fb5; border-bottom:0; }
      /* focus: EXTERNAL cream stepped ring — distinct from the equipped amber double frame. */
      .cos-card:focus-visible{ outline:2px solid var(--cream); outline-offset:3px; }
      .cos-icon{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--dun-4); }
      .cos-icon canvas{ image-rendering:pixelated; }
      /* Blob-color swatches always ride with their .cos-name label — never color alone. */
      .cos-swatch{ display:block; width:28px; height:28px; box-shadow:inset 0 0 0 2px rgba(5,3,11,.65); }
      .cos-name{ font-family:var(--f-ui); font-size:8px; letter-spacing:.3px; line-height:1.2; text-align:center; }
      /* The chip: EQUIPPED / the exact unlock condition / NEW. Reserved two lines. */
      .cos-chip{ font-family:var(--f-ui); font-size:7px; letter-spacing:.5px; min-height:18px; color:var(--cream); text-align:center; line-height:1.3; }
      .cos-card.equipped .cos-chip{ color:var(--amber-hi); }
      /* Tiny corner spinner while the background write is in flight (stepped rotation —
         pixel-friendly; the card already reads EQUIPPED, success just clears this). */
      .cos-saving{ position:absolute; left:4px; bottom:4px; width:8px; height:8px;
        border:2px solid var(--dun-4); border-top-color:var(--cream);
        animation:cosSaving .7s steps(8) infinite; }
      @keyframes cosSaving{ to{ transform:rotate(360deg); } }
      /* The ONE inline message line (failure revert notice / locked-condition readout). */
      .closet-note{ min-height:14px; font-size:11px; margin:0; text-align:left; flex:0 0 14px; }
      /* The always-visible close affordance on the profile surfaces (48px touch target),
         pinned to the shell corner; same action as Back/Escape/B — just closes. */
      .panel-close{ position:absolute; top:8px; right:8px; z-index:2; min-width:48px; min-height:48px; width:48px; height:48px;
        padding:0; font-size:14px; letter-spacing:0; }
      /* The closet OVERLAY (the title's CUSTOMIZE door): a panel ABOVE the title, never
         a mode swap — the translucent scrim keeps Play visibly anchored behind it, and
         closing returns to the untouched title with the blob repainted in place. */
      .closet-scrim{ position:fixed; inset:0; z-index:12; display:flex; align-items:center; justify-content:center;
        padding:16px; background:rgba(5,3,11,.5); }
      .closet-pop{ width:min(720px,94vw); max-height:min(560px,94vh); overflow:hidden auto; gap:10px; }
      .closet-pop .closet-pop-h{ padding-right:56px; }
      /* Mobile closet: PINNED preview stage, horizontal category rail, 2-col grid of
         >=64px cards — a tap equips instantly, so nothing needs to stay in reach. */
      @media (max-width:680px){
        .closet-panel{ height:auto; max-height:calc(100vh - 150px); overflow-y:auto; flex-direction:column; align-items:stretch; }
        .closet-stage{ position:sticky; top:0; z-index:2; flex-direction:row; justify-content:center; align-items:center;
          background:#0d0819; padding:6px 0; box-shadow:0 2px 0 var(--dun-3); }
        .closet-stage .blob-preview{ width:96px; height:96px; }
        .closet-right{ width:100%; }
        .closet-cats{ overflow-x:auto; flex:0 0 44px; }
        .closet-cat{ flex:0 0 auto; min-width:96px; min-height:44px; white-space:nowrap; }
        .closet-grid{ overflow-y:visible; min-height:0; }
        .cos-card{ width:calc(50% - 4px); min-width:64px; height:104px; }
      }
      /* Touch: full-leaderboard rows keep >=48px targets, category tabs >=44px, the
         72px-tall closet cards already clear the target comfortably, and the CUSTOMIZE
         chip grows to a full touch target. */
      @media (pointer:coarse){
        .lb-rows-full .lb-row{ height:48px; flex:0 0 48px; }
        .closet-cat{ min-height:44px; }
        .stage-customize{ min-height:44px; }
      }

      /* --- post-run sign-in nudge: renders WITH the screen, dismiss swaps in place --- */
      .nudge{ display:flex; flex-direction:column; gap:8px; align-items:center; min-height:88px; padding:10px 14px;
        background:#0d0819; box-shadow:inset 0 0 0 2px var(--dun-3); }
      .nudge-copy{ font-family:var(--f-ui); font-size:10px; letter-spacing:.3px; color:var(--cream); text-transform:none; line-height:1.5; margin:0; max-width:460px; }
      .nudge-row{ display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; }
      .nudge-row .btn-google{ width:auto; min-width:200px; }
      .nudge-later{ min-width:0; font-size:10px; padding:9px 14px; }
      .unlock-line{ color:var(--amber-hi); font-weight:700; letter-spacing:.5px; }

      @media (max-width:680px){
        .pp-top{ flex-direction:column; gap:12px; }
      }
      /* Touch-friendly rows on the FULL leaderboard screen for narrow/coarse-pointer
         devices (the title glance keeps its fixed 28px rows — its 154px reserve is exact). */
      @media (max-width:680px), (pointer:coarse){
        .lb-rows-full .lb-row{ height:48px; flex:0 0 48px; }
        .lb-view{ min-height:32px; }
      }

    </style>
  </head>
  <body>
    <div id="app"><canvas id="game"></canvas></div>
    <canvas id="minimap" width="176" height="132"></canvas>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
