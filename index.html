<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
    <title>blobrogue — a cowboy-blob roguelike</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #0e0b1a; overflow: hidden; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
      #app { display: flex; align-items: center; justify-content: center; height: 100%; }
      canvas { image-rendering: pixelated; background: #14101f; touch-action: none; }
      #minimap { position: fixed; top: 12px; right: 12px; z-index: 5; border-radius: 8px; }

      #overlay, .pause-overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; color: #ffe6b0; background: rgba(14,11,26,0.86); text-align: center; }
      .hidden { display: none !important; }

      .settings { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 4px; }
      .settings-shake { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #cbb6d6; }
      .settings-label { text-transform: uppercase; letter-spacing: 1px; color: #8579a0; }
      .settings-val { color: #ffd27a; font-variant-numeric: tabular-nums; }
      input[type="range"] { -webkit-appearance: none; appearance: none; width: 160px; height: 6px; padding: 0; border: none; border-radius: 4px; background: rgba(255,180,59,0.22); cursor: pointer; }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #ffb43b; cursor: pointer; }
      input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border: none; border-radius: 50%; background: #ffb43b; cursor: pointer; }

      .menu { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px; max-width: 480px; }
      .menu h1 { font-family:'Press Start 2P', monospace; font-size: 30px; color: #ffb43b; letter-spacing: 2px; line-height:1.3; text-shadow: 0 4px 0 #05030b, 0 0 18px rgba(255,180,59,0.35); }
      .menu h1 .r { color:#ffe9b0; }
      .menu h1.died { color: #ff6a6a; text-shadow:0 4px 0 #05030b, 0 0 18px rgba(255,90,90,0.4); }
      .menu p { font-size: 13px; color: #cbb6d6; line-height: 1.6; }
      .menu p.muted { font-size: 12px; color: #8579a0; }
      .menu p.hint { font-size: 11px; color: #6f6689; margin-top: 4px; }

      .btnrow { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      /* --- UI kit: chunky diegetic arcade-dungeon buttons (ui designer spec) --- */
      button { --c:#ffb43b; --c-hi:#ffd166; --c-lo:#b06e12; --tx:#120a24;
        position:relative; display:inline-flex; align-items:center; justify-content:center; gap:9px;
        font-family:'Silkscreen',monospace; font-weight:700; font-size:15px; letter-spacing:1px; text-transform:uppercase;
        color:var(--tx); background:var(--c); cursor:pointer; border:0; padding:15px 28px; min-width:210px; line-height:1;
        clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
        box-shadow: inset 0 4px 0 0 var(--c-hi), inset 0 -5px 0 0 var(--c-lo), inset 0 0 0 3px #120a24, 0 6px 0 0 #05030b, 0 6px 0 3px #120a24;
        transition:transform .05s steps(2),box-shadow .05s steps(2),background .08s; text-shadow:0 2px 0 rgba(0,0,0,.28); }
      button:hover { --c:#ffd166; --c-hi:#ffe9b0; --c-lo:#ffb43b; transform:translateY(-2px);
        box-shadow:inset 0 4px 0 0 var(--c-hi),inset 0 -5px 0 0 var(--c-lo),inset 0 0 0 3px #120a24,0 8px 0 0 #05030b,0 8px 0 3px #120a24; }
      button:active { transform:translateY(6px);
        box-shadow:inset 0 4px 0 0 var(--c-hi),inset 0 -4px 0 0 var(--c-lo),inset 0 0 0 3px #120a24,0 0 0 0 #05030b,0 0 0 3px #120a24; }
      button:focus-visible { outline:3px solid #ffe9b0; outline-offset:5px; }
      button.secondary { --c:#2a2140; --c-hi:#46356b; --c-lo:#171227; --tx:#ffe9b0; text-shadow:0 2px 0 rgba(0,0,0,.5); }
      button.secondary:hover { --c:#46356b; --c-hi:#5a4788; --c-lo:#2a2140; --tx:#fff; }

      .namerow { display: flex; align-items: center; gap: 10px; }
      .namerow label { font-size: 12px; color: #8579a0; text-transform: uppercase; letter-spacing: 1px; }
      input { font: inherit; font-size: 15px; padding: 9px 14px; background: #120e20; color: #ffe6b0; border: 1px solid rgba(255,180,59,0.35); border-radius: 8px; text-align: center; }
      input:focus { outline: none; border-color: #ffb43b; }
      .code-input { font-size: 26px; letter-spacing: 8px; width: 200px; }

      .profile { min-height: 88px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .profile-title { font-size: 12px; color: #ffb43b; letter-spacing: 1px; text-transform: uppercase; }
      .profile-grid { display: flex; gap: 18px; }
      .stat { display: flex; flex-direction: column; align-items: center; }
      .stat-value { font-size: 20px; color: #ffe6b0; font-variant-numeric: tabular-nums; }
      .stat-label { font-size: 11px; color: #8579a0; }

      .code-badge { font-size: 40px; letter-spacing: 10px; color: #ffb43b; background: #120e20; border: 1px solid rgba(255,180,59,0.4); border-radius: 12px; padding: 10px 22px; }
      .playerlist { display: flex; flex-direction: column; gap: 8px; min-width: 220px; }
      .playerrow { display: flex; align-items: center; gap: 10px; font-size: 14px; }
      .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="game"></canvas></div>
    <canvas id="minimap" width="176" height="132"></canvas>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
